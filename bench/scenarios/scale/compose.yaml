# One service brought up with `--scale app=5` at run time, so the harness
# measures replica fan-out cost under an identical compose input.
services:
  app:
    image: docker.io/library/alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: ["sleep", "3600"]
    init: true
