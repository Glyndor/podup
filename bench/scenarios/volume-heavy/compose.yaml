# A service with several named volumes, exercising volume create/teardown
# (down is measured with -v so the volumes are removed each iteration).
services:
  app:
    image: docker.io/library/alpine@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    command: ["sleep", "3600"]
    init: true
    volumes:
      - data1:/data1
      - data2:/data2
      - data3:/data3
      - data4:/data4
      - data5:/data5
      - data6:/data6
volumes:
  data1: {}
  data2: {}
  data3: {}
  data4: {}
  data5: {}
  data6: {}
