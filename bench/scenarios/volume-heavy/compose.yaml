# A service with several named volumes, exercising volume create/teardown
# (down is measured with -v so the volumes are removed each iteration).
services:
  app:
    image: docker.io/library/alpine@sha256:f59abe656b692d901e184be3445e084786602108599d2a51d229c0f5a48c71bf
    command: ["sleep", "3600"]
    init: true
    volumes:
      - data1:/data1
      - data2:/data2
      - data3:/data3
      - data4:/data4
      - data5:/data5
      - data6:/data6
volumes:
  data1: {}
  data2: {}
  data3: {}
  data4: {}
  data5: {}
  data6: {}
