# Custom bridge network with explicit IPAM (subnet + gateway) and two attached
# services, exercising network create + address assignment on up/down.
services:
  a:
    image: docker.io/library/alpine@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    command: ["sleep", "3600"]
    init: true
    networks:
      app_net:
        ipv4_address: 10.137.0.10
  b:
    image: docker.io/library/alpine@sha256:3f4d6b32e26703c6082839234f43769d5046b3ac7c910033911d1e71d8cd630a
    command: ["sleep", "3600"]
    init: true
    networks:
      app_net:
        ipv4_address: 10.137.0.11
networks:
  app_net:
    driver: bridge
    ipam:
      config:
        - subnet: 10.137.0.0/24
          gateway: 10.137.0.1
