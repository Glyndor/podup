[package]
name = "podup"
version = "5.13.0"
edition = "2021"
rust-version = "1.88"
# podup is a binary that happens to build a library, not a library that ships a
# binary. The `[lib]` target stays -- the integration tests in `tests/` are
# built against it -- but it is no longer published.
#
# The reason it was published was helmly-agent, and helmly-agent does not use
# it: zero `use podup::`, zero entries in its `Cargo.lock`, and its own manifest
# records "that dep is gone". When the dependency did exist it was a git dep, so
# crates.io was never what carried it. crates.io reports zero reverse
# dependencies. What publishing cost, meanwhile, was a semver commitment on
# seventeen `pub` items that nobody consumes, plus two required status checks.
#
# 5.4.0 stays published, which is not a loose end: it keeps the name reserved.
publish = false
description = "Run Compose projects on rootless Podman through its native libpod API"
license = "MIT"
repository = "https://github.com/Glyndor/podup"
homepage = "https://glyndor.net/projects/podup"
# Not docs.rs: it only builds published crates, so it would sit at 5.4.0 for
# good and read as the current API. The repository's own docs move with the code.
documentation = "https://github.com/Glyndor/podup/tree/main/docs"
readme = "README.md"
keywords = ["podman", "compose", "quadlet", "docker-compose", "rootless"]
categories = ["command-line-utilities", "virtualization", "development-tools"]
# What `cargo package` ships. Not to be confused with `[workspace] exclude`
# further down, which only decides workspace membership: that one names
# `bench/timeit` and `fuzz`, which reads as though packaging is handled and
# is a different question entirely. Measured before this line changed,
# `cargo package --list` carried 30 files from `bench/` and both licence
# report templates.
exclude = [
	"/.github",
	"/about.hbs",
	"/about.toml",
	"/bench",
	"/debian",
	"/deny.toml",
	"/docs",
	"/install.ps1",
	"/install.sh",
	"/tests",
]

[[bin]]
name = "podup"
path = "internal/main.rs"

[lib]
name = "podup"
path = "internal/lib.rs"

# The engine integration suite drives the library through test-only seams
# (`test_exec_capture`, `test_project_container_names`) that live behind the
# `test-helpers` feature so they never reach a release build. Without the
# feature the target does not compile, and `debian/rules` builds with
# `--no-default-features --features watch,completions`, so it broke there while
# every other caller passed either `--all-features` or `--features test-helpers`
# and stayed green.
#
# `required-features` makes cargo skip the target instead of failing to build it.
# Nothing is lost: the suite needs a reachable Podman, which a package builder
# does not have, and the lane that gates merges always passes the feature.
[[test]]
name = "engine_integration"
path = "tests/engine_integration.rs"
required-features = ["test-helpers"]

# Test crates that live in a folder. Cargo discovers only `tests/*.rs` and
# `tests/*/main.rs`, so a crate under `tests/<concern>/` is named here, and
# keeping the same `name` keeps `cargo test --test <name>`, the CI lanes and
# every test's reported identity as they were. The crates still at the top
# level are found by discovery and need no entry. `every_source_file_is_compiled`
# reads these paths, so a crate listed here cannot go unbuilt silently.
[[test]]
name = "build_contract"
path = "tests/cli/output/build_contract.rs"

[[test]]
name = "cli_aliases"
