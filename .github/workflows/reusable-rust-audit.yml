name: Rust audit (reusable)

# Scheduled supply-chain audit for Rust crates: cargo-audit flags RUSTSEC
# advisories, cargo-deny enforces the license/ban/source policy in deny.toml.
# Callers wire the schedule (e.g. weekly cron) in their own workflow.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Cargo workspace
        type: string
        default: "."
      # Pinned, not the runner's floating preinstalled Rust; see rust-ci.yml's
      # toolchain input for why an unpinned toolchain is a problem.
      toolchain:
        description: Rust toolchain to pin the audit and deny jobs to
        type: string
        default: "1.100"
      # Each tool is the official release binary, downloaded on every run and
      # checked against the sha256 below before it is run. The version and the sum
      # travel together: overriding one without the other fails the check. A
      # security tool is never restored from a cache and never built here, so the
      # file that runs is the file the release published.
      cargo-audit-version:
        description: Exact version of cargo-audit to download; bumped by editing this file
        type: string
        default: "0.23.0"
      cargo-audit-sha256:
        description: sha256 of that release's x86_64-unknown-linux-musl archive; travels with cargo-audit-version
        type: string
        default: "4f01c74ed84b2dffd0b1d37012a62cdf2a92c96e25bdf8eec7fcc0d4d3eb7811"
      cargo-deny-version:
        description: Exact version of cargo-deny to download; bumped by editing this file
        type: string
        default: "0.22.1"
      cargo-deny-sha256:
        description: sha256 of that release's x86_64-unknown-linux-musl archive; travels with cargo-deny-version
        type: string
        default: "13f7e825e9cb811c2f8de63f29b0f45851dfb53004029f0f2501af524728364d"

permissions:
  contents: read

# A security result is never cancelled by a newer push: the group is the run itself.
concurrency:
  group: rust-audit-${{ github.workflow }}-${{ github.run_id }}-${{ inputs.working-directory }}
  cancel-in-progress: false

jobs:
  audit:
    # Required on develop and on main. The name carries the kind of run, as the other
    # required names do (see reusable-dco.yml), and this check is also asked of the merge
    # queue: a security result is not advisory.
    name: cargo audit${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || !(github.event_name == 'merge_group' || github.event_name == 'pull_request' && github.base_ref == 'develop') && format(' ({0})', github.event_name) || '' }}
    runs-on: ubuntu-latest
    # Bound: the download and the check take seconds now; the audit itself is the rest. Never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Download cargo-audit and check its sum
        env:
          VERSION: ${{ inputs.cargo-audit-version }}
          SHA256: ${{ inputs.cargo-audit-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-audit.tgz"
          curl -sSfL -o "$archive" "https://github.com/rustsec/rustsec/releases/download/cargo-audit%2Fv${VERSION}/cargo-audit-x86_64-unknown-linux-musl-v${VERSION}.tgz"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/tools" --strip-components=1 "cargo-audit-x86_64-unknown-linux-musl-v${VERSION}/cargo-audit"
          echo "$RUNNER_TEMP/tools" >>"$GITHUB_PATH"

      - name: Run cargo audit
        # --deny warnings so unmaintained/unsound/yanked advisories also fail,
        # not just vulnerabilities.
        run: cargo audit --deny warnings

  deny:
    # Required on develop and on main. The name carries the kind of run, as the other
    # required names do (see reusable-dco.yml), and this check is also asked of the merge
    # queue: a security result is not advisory.
    name: cargo deny${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || !(github.event_name == 'merge_group' || github.event_name == 'pull_request' && github.base_ref == 'develop') && format(' ({0})', github.event_name) || '' }}
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 137s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Download cargo-deny and check its sum
        env:
          VERSION: ${{ inputs.cargo-deny-version }}
          SHA256: ${{ inputs.cargo-deny-sha256 }}
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${VERSION}/cargo-deny-${VERSION}-x86_64-unknown-linux-musl.tar.gz"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/tools"
          tar -xzf "$archive" -C "$RUNNER_TEMP/tools" --strip-components=1 "cargo-deny-${VERSION}-x86_64-unknown-linux-musl/cargo-deny"
          echo "$RUNNER_TEMP/tools" >>"$GITHUB_PATH"

      - name: Run cargo deny
        run: cargo-deny check
