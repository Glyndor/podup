name: DCO (reusable)

# Enforce the Developer Certificate of Origin: every commit on a pull request
# must carry a `Signed-off-by:` trailer. Machine-checked attestation gate rather
# than a convention, which government and enterprise audits expect.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: dco-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dco:
    # The name says which kind of run produced it: nothing for a pull request into
    # `develop` and for the merge queue, `(promotion)` for a pull request into `main`,
    # and the event in brackets for everything else (a push, a schedule, a pull request
    # on any other base). `==` in an expression ignores case, so the trigger limits the
    # bases with `branches`, which does not, and the gate checks the base in shell. A required
    # check is matched by name on a commit, so the push that lands on `develop` and
    # the pull request that promotes the same commit into `main` must not be able to
    # answer for each other: they get different names and the ruleset of each branch
    # requires its own.
    name: Signed-off-by present on every commit${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || !(github.event_name == 'merge_group' || github.event_name == 'pull_request' && github.base_ref == 'develop') && format(' ({0})', github.event_name) || '' }}
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 7s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The check is the base commit's copy, never a file of the change. A base that does
      # not have it (the pull request that introduces it) is told apart from one that
      # cannot be read, which fails.
      - name: Take the check from the base commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          f=.github/scripts/hygiene/check-dco.sh
          [ -n "$BASE_SHA" ] || { echo "::error::no base commit: this run carries no pull_request or merge_group range"; exit 1; }
          mkdir -p "$RUNNER_TEMP/judge"
          listing="$(git ls-tree --name-only "$BASE_SHA" -- "$f")" || exit 1
          if [ -n "$listing" ]; then
            git show "$BASE_SHA:$f" >"$RUNNER_TEMP/judge/check-dco.sh" || exit 1
          else
            echo "::notice::$f is not in the base commit; the copy of the change is used"
            cp "$f" "$RUNNER_TEMP/judge/check-dco.sh"
          fi

      # BASE_SHA and HEAD_SHA are the range the event carries: on a pull request its real
      # base and head (not refs/pull/N/merge), in the merge queue the commit that will land
      # on develop, so the trailer is checked on the artefact itself. An empty value makes
      # the script fail rather than list nothing. The script holds both halves: a trailer
      # whose address is the author's on every commit, and no merge commit whose tree is
      # not the clean merge of its parents.
      - name: Every commit is signed off and no merge hides a change
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: bash "$RUNNER_TEMP/judge/check-dco.sh" "$BASE_SHA" "$HEAD_SHA"
