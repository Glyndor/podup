name: Repository health

# The advisory observations about the REPOSITORY, as opposed to the change
# under review: whether the scheduled workflows still fire, whether the
# newest run of `ci.yml` on `main` and on `develop` was green, and whether
# Dependabot has spoken recently.
#
# None of that says anything about the patch a pull request proposes. These
# four jobs used to run on every pull request update, so concurrent pull
# requests polled the same branch heads and the same scheduler history four
# times each, and the branch-health poll can take eight minutes. A check that
# costs eight minutes and learns nothing about the change is a check nobody
# should pay for on every keystroke of a review.
#
# They live in their own workflow so that:
#
# - the pull request lane does not carry them at all;
# - a failure here cannot make the branch CI whose health they inspect red,
#   which is the self-reporting loop the branch-health gate used to be able
#   to enter: it read the newest run of `ci.yml` on a branch, and it was a
#   job in that very run;
# - the scheduled run does not drag the Rust lanes of `ci.yml` with it.
#
# The schedule is the primary trigger and the push to a protected branch is
# the fallback. A cron that stops firing emits nothing, and "no alert" is
# indistinguishable from "all clear": every scheduled workflow in this
# organisation went dark on 2026-06-29, four repos stayed dark for another
# four weeks while reporting `active` the whole time, and it cost a real
# finding. The push lane is what turns a dead cron back into a red check.
#
# The jobs that test the MONITORING LOGIC stay on pull requests. The shell
# suite in `lint-shell.yml` and the Rust repository-contract suite run
# whenever the scripts and workflows below change, so a regression in the
# observer is still caught by the change that introduces it.
#
# These observations are ADVISORY and must never be promoted to required
# status checks. Each one fails because a cron or a branch somewhere else
# stopped being green, which has nothing to do with the change under review,
# so requiring one would block every pull request for the length of an
# unrelated outage. The rule lives in the organisation standard, and it is
# repeated here because this file is what somebody wiring a ruleset has open.

on:
  # The fallback for a dead schedule: every push to a protected branch
  # observes the repository again.
  push:
    branches: [main, develop]
  # The primary trigger. Daily, because the tightest limit the freshness
  # watcher enforces is three days (the daily Podman lanes). At 14:23 UTC,
  # after the schedules this watcher reads, so the answer covers the same
  # day rather than the one before.
  schedule:
    - cron: "23 14 * * *"
  # So an operator can ask the question now instead of waiting for the next
  # cron.
  workflow_dispatch:

permissions:
  contents: read

# Same shape as `ci.yml`. The group carries the run id, so the events that
# are not pull requests do not share it and GitHub never drops a pending
# run, and `cancel-in-progress` is false for every event this workflow
# fires on. The pull-request clause is here because the shape is the one
# the repository uses; this workflow never fires on a pull request.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The schedule-freshness gate: it turns the absence of a scheduled run
  # into a red check. The header above says what a dead cron cost.
  #
  # max-age-days allows about two periods, so one miss is tolerated:
  # 15 for weekly, 3 for daily, 65 for the monthly benchmark.
  #
  # These observations are ADVISORY and must never be promoted to required
  # status checks. Each one fails because a cron somewhere else stopped
  # firing, which has nothing to do with the change under review, so
  # requiring one would block every pull request for the length of an
  # unrelated outage. The rule lives in the organisation standard, and it is
  # repeated here because this file is what somebody wiring a ruleset has
  # open.
  #
  # A newly added scheduled workflow cannot be registered here in the same
  # pull request that adds it. The guard passes only on a run with
  # `event=schedule` and `status=success`; GitHub fires crons solely from
  # the default branch, and `workflow_dispatch` does not count. So a fresh
  # entry fails with "No successful scheduled run on record" until the
  # workflow has reached `main` and its cron has fired once.
  # `pin-watch.yml` (#1526) is waiting for exactly that and gets its entry
  # afterwards.
  #
  # `podman-lane-develop-nightly.yml` has a cron and is deliberately NOT
  # watched here, so that its absence reads as a decision rather than an
  # oversight. Two reasons, and the second is the blocking one.
  #
  # Its output is an observation, not a gate: it reports the coverage of
  # `develop` under Podman 6 against a floor that no pull request can move,
  # since the gate a pull request answers to is the 76 per cent threshold on
  # `rust / Coverage`. A watcher would then report the staleness of a number
  # nobody is required to keep fresh.
  #
  # And a watcher added today would be born red. The guard reads the newest
  # scheduled run with `status=success`, and measured on 2026-09-06 the last
  # successful nightly was 2026-09-01: five consecutive nights failed on the
  # 88 per cent floor (85.51, then 85.38, then 85.40 on the three that print
  # the figure). A cron that fires nightly and fails nightly is, to this
  # guard, indistinguishable from a cron that stopped. The entry belongs here
  # once that lane is green again, not before, and #1380 is where the floor
  # itself is argued.
  #
  # The `if:` refuses a pull request even if this workflow ever grows that
  # trigger: the observation answers a question about the repository, not
  # about the change under review.
  freshness:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-schedule-freshness.yml
    with:
      # Monthly benchmark uses 65 days; weekly and daily limits remain per
      # entry.
      workflows: |
        audit.yml 15
        fuzz.yml 15
        podman-lane.yml 3
        podman-watch.yml 3
        benchmark.yml 65

  # Fails when the newest COMPLETED run of `ci.yml` on a protected branch is
  # not a success. The freshness watchers above cannot catch this: they read
  # the newest SUCCESSFUL scheduled run, so a failing scheduled run is
  # missing from their answer by construction. A protected branch whose
  # gates are red is the published state failing rather than a broken
  # integration branch, and that is the gap this closes.
  #
  # Two jobs, one per branch. They MUST stay separate. Each name carries
  # the branch it watches, and a single job that watched both would emit
  # one check name covering two branches - and a check name that does not
  # move is the property required checks depend on (Glyndor/podup#1552).
  #
  # MUST NOT BECOME A REQUIRED STATUS CHECK. A red `main` would then block
  # the pull request that repairs it, which is the exact failure mode this
  # check exists to surface. The reason is repeated inside the reusable,
  # where somebody wiring required checks would look first. Do not remove
  # either copy.
  #
  # The `if:` keeps a health caller out of the push run of the branch it
  # watches. On such a push the reusable hands the script the pushed commit,
  # and the script would then wait for the `ci.yml` run of that commit,
  # which takes far longer than the eight minutes the poll allows: the
  # answer would be a false red. The job reads the most recent run of
  # `ci.yml` on `main` (or `develop`), and that run is itself a push run on
  # that branch.
  #
  # A skipped job is fine here because this check is advisory and is not on
  # the ruleset, so a missing run does not break a pull request.
  health-main:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || github.ref_name != 'main')
    name: branch health (main)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-branch-health.yml
    with:
      workflow: ci.yml
      branch: main

  # The same gate for `develop`, and the same reason for the branch
  # comparison in its `if:`. The two jobs stay separate: a check name that
  # covers both branches is a check name that does not move.
  health-develop:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'push' || github.ref_name != 'develop')
    name: branch health (develop)
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/reusable-branch-health.yml
    with:
      workflow: ci.yml
      branch: develop

  # Dependabot silently stops proposing updates when its config is not
  # re-registered, and like a dead cron it reports nothing at all. This fails
  # when no pull request has been opened recently enough.
  #
  # v1.16.0 read one page of twenty pull requests and filtered it for the bot,
  # which measures how busy the repository is rather than whether Dependabot is
  # running: run 32435521566 reported "no Dependabot pull request on record"
  # while ten sat open. v1.16.1 pages the window.
  dependabot-freshness:
    if: github.event_name != 'pull_request' && github.event_name != 'merge_group'
    uses: ./.github/workflows/reusable-dependabot-freshness.yml
    with:
      max-age-days: 15
