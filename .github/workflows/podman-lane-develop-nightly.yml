name: podman-lane (develop nightly)
# Nightly live-Podman coverage on the `develop` branch: early-warning signal
# for coverage drift that the `main` nightly (#1326) cannot see (#1380).
#
# The `main` nightly runs on the default branch only, so a regression landing on
# `develop` is invisible to its 88% floor until the next release PR runs the
# nightly. This workflow is a thin copy of `.github/workflows/podman-lane.yml`
# with a different `ref` and a cron offset by 12h from the `main` one (the
# `main` nightly fires at 09:00 UTC; this one fires at 21:00 UTC) so the two
# never collide on runner capacity.
#
# Coverage is the only output consumed. The suite's pass/fail gate is unchanged
# from the per-PR lane and still lives there; this job is an observation
# (per #1326's own recommendation; a second instrumented build per PR is too
# expensive to gate on).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 21 * * *"
permissions:
  contents: read
# Serialize runs that observe or publish the same resource without interruption.
concurrency:
  group: ${{ github.workflow }}-develop
  cancel-in-progress: false

jobs:
  podman-vm:
    runs-on: ubuntu-24.04
    # Same wall-clock budget as the per-PR lane (#1338): the coverage run
    # serialises a second instrumented build inside the VM, and the Podman 6
    # leg finished at 89% of this budget on the most recent measurement.
    timeout-minutes: 95
    strategy:
      fail-fast: false
      # Only the Podman 6 leg runs coverage. Podman 5 and 6 both measure the
      # suite at ~91.5%, so gating the older major would be redundant. The
      # per-PR lane is the full-support cross-check.
      matrix:
        podman: ["6"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: develop
      - name: Install qemu + cloud tools
        timeout-minutes: 18
        run: |
          # apt has hung for the whole 95 min job budget on a saturated runner, and the
          # cancelled leg made the merge queue drop the groups behind it. Bound each
          # attempt and retry instead.
          #
          # What was measured (podman-vm legs on 2026-11-06): the step failed four
          # times with all three attempts ending at the 240 s `timeout`, and with
          # `-qq` nothing said which host held it. A host that does not answer is
          # waited for without limit by apt's own defaults, and `apt-get update`
          # ignores an index it could not fetch, so the useful behaviour is to give
          # up on a connection that is silent for 20 s instead of waiting out the
          # whole `timeout`. The output is no longer silenced, so the next failure
          # names the host. The runner image names its mirror in
          # /etc/apt/apt-mirrors.txt (the sources point at it with mirror+file:), so
          # the fallback rewrites that file as well as the sources: rewriting only the
          # sources left every attempt on the Azure host. On 2026-11-11 plain HTTP to
          # both the Azure copy and archive.ubuntu.com timed out on every leg while
          # HTTPS to packages.microsoft.com answered, so the second attempt uses the
          # Ubuntu archive over HTTPS and the third the kernel.org copy over HTTPS.
          export DEBIAN_FRONTEND=noninteractive
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true)
          echo "apt sources:"
          grep -rhoE 'https?://[^/ ]+' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | LC_ALL=C sort -u
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              mirror="https://archive.ubuntu.com/ubuntu/"
              [ "$attempt" -gt 2 ] && mirror="https://mirrors.edge.kernel.org/ubuntu/"
              echo "apt: attempt $attempt uses $mirror"
              sudo sed -i -E "s#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#$mirror#g" /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
              printf '%s\tpriority:1\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            if sudo timeout 90 apt-get -q "${apt_opts[@]}" update && sudo timeout 210 apt-get -q "${apt_opts[@]}" install -y qemu-system-x86 qemu-utils cloud-image-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1
      - name: Fetch Fedora rawhide cloud image (Podman 6)
        run: |
          # The same script the pull request lane uses: bounded transfers, a mirror
          # fallback and a SHA-256 check. A bare curl here had no deadline, so a
          # stalled transfer held the whole job budget.
          img=$(bash "$GITHUB_WORKSPACE/.github/scripts/fedora_image/fetch-fedora-image.sh" \
              "${{ matrix.podman }}" "$RUNNER_TEMP/vm.qcow2")
          echo "image: $img"
          qemu-img resize "$RUNNER_TEMP/vm.qcow2" 40G
      - name: Build cloud-init seed
        run: |
          cat > "$RUNNER_TEMP/user-data" <<'EOF'
          #cloud-config
          growpart: {mode: auto, devices: ['/']}
          resize_rootfs: true
          users:
            - name: tester
              sudo: 'ALL=(ALL) NOPASSWD:ALL'
              shell: /bin/bash
          write_files:
            - path: /etc/containers/containers.conf
              content: |
                [containers]
                log_driver = "k8s-file"
            - path: /usr/local/bin/run-suite.sh
              permissions: '0755'
              content: |
                #!/bin/bash
                export XDG_RUNTIME_DIR=/run/user/$(id -u)
                systemctl --user start podman.socket
                export PODMAN_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock
                export PODUP_REQUIRE_PODMAN=1
                cd "$HOME/podup" || exit 90
                COVERAGE=1
                export LLVM_COV=/usr/bin/llvm-cov
                export LLVM_PROFDATA=/usr/bin/llvm-profdata
                DROPPED='IncompleteMessage|connection closed before message completed|channel closed|Connection reset|error reading a body from connection|unexpected EOF during chunk size line|IncompleteBody|body-unexpected-eof'
                for attempt in 1 2; do
                  RUST_LOG=podup=warn cargo install cargo-llvm-cov --locked --version "=0.9.1" >/tmp/covinstall.log 2>&1
                  cargo llvm-cov --all-features --summary-only \
                    -- --test-threads=1 >/tmp/cov.log 2>&1
                  RC=$?
                  [ "$RC" -eq 0 ] && break
                  grep -qE "$DROPPED" /tmp/cov.log || break
                  echo "=== nested-virt transient on attempt $attempt; retrying ==="
                done
                tail -20 /tmp/cov.log
                # Emit exactly one `PODUP_COVERAGE=<pct>` line for the gate step
                # to parse. The previous script printed the coverage only as part
                # of the tail output, which the gate's `grep -oE 'PODUP_COVERAGE=…'`
                # never matched, so the gate treated the whole run as a missing
                # number and exited 0 with a `::warning::`. Branch is fixed in
                # one place so the gate (the contract the lane actually measures)
                # sees a clean number.
                awk '$1=="TOTAL" { for (i=1;i<=NF;i++) if ($i ~ /%$/) { print "PODUP_COVERAGE=" $i; exit } }' /tmp/cov.log
                echo "PODUP_COVERAGE_BRANCH=develop"
          runcmd:
            - bash -c 'dnf install -y podman rust cargo gcc git llvm >/dev/console 2>&1'
            # Same as the per-pull-request lane: upgrade the preinstalled Podman (#1922).
            - bash -c 'dnf upgrade -y podman >/dev/console 2>&1'
            - bash -c 'mkdir -p /mnt/repo && mount -t 9p -o trans=virtio,version=9p2000.L repo /mnt/repo && cp -a /mnt/repo /home/tester/podup && chown -R tester:tester /home/tester/podup'
            - bash -c 'sudo -iu tester /usr/local/bin/run-suite.sh >/dev/console 2>&1'
            - bash -c 'echo PROBE_DONE >/dev/console; sleep 2; poweroff'
          EOF
          cloud-localds "$RUNNER_TEMP/seed.iso" "$RUNNER_TEMP/user-data"
      - name: Boot VM
        run: |
          sudo timeout 4200 qemu-system-x86_64 -enable-kvm -cpu host -m 6144 -smp 4 \
            -drive file="$RUNNER_TEMP/vm.qcow2",if=virtio,format=qcow2 \
            -drive file="$RUNNER_TEMP/seed.iso",if=virtio,format=raw \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -virtfs local,path=${{ github.workspace }},mount_tag=repo,security_model=none,id=repo \
            -display none -serial stdio 2>&1 | tee "$RUNNER_TEMP/vm.log" || true
      - name: Report develop coverage
        run: |
          L="$RUNNER_TEMP/vm.log"
          COV=$(grep -oE 'PODUP_COVERAGE=[^ ]+' "$L" | tail -1 | cut -d= -f2)
          if [ -z "$COV" ]; then
            echo "::warning::no coverage number reported on develop; the VM did not complete the run or the instrumented build failed"
            tail -20 "$L"
            exit 0
          fi
          echo "develop coverage: $COV"
          echo "- **develop coverage:** $COV" >> "$GITHUB_STEP_SUMMARY"
          # Nightly floor on develop: same 88% the `main` nightly applies
          # (#1326), reported on the Podman 6 leg. A regression that
          # takes develop below 88% is the early warning this workflow
          # exists to surface: the same shape of break, in the half-life
          # before the next release PR.
          # `cargo llvm-cov` emits a percent like `91.30%`. Strip the
          # trailing `%` and the fractional part (`cut -d. -f1`) so
          # `printf '%d'` gets an integer: `printf '%.0f' "91.30"` errors
          # with `invalid number`, and the whole job fails closed exactly
          # when a regression would otherwise have been missed.
          COV_INT=$(printf '%d' "$(echo "$COV" | tr -dc '0-9.' | cut -d. -f1)")
          if [ "$COV_INT" -lt 88 ]; then
            echo "::error::develop coverage $COV is below the 88% nightly floor (#1380)."
            exit 1
          fi
