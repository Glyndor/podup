name: Branch health (reusable)

# Fails when the run for a branch's CURRENT head is not a success.
#
# The companion guard `reusable-schedule-freshness.yml` watches workflows
# that fire on `event=schedule`; this one watches a workflow on a branch.
# The two together are the same idea in two places: a thing that is
# supposed to be true about a workflow is converted from "silence when
# broken" into a red check on ordinary work, because nobody watches a
# quiet log.
#
# The defect that prompted this file: the freshness watchers cannot catch
# it. They read the newest SUCCESSFUL scheduled run, so a failing run is
# missing from their answer by construction. On 2026-09-06 three
# distribution channels sat with `main` red for twenty minutes after a
# pull request merged while its suite was still reporting, and the only
# reason anybody knew is that somebody went looking. The fix the
# other three shipped was `scripts/check-suite-on-main.sh`; this file
# mirrors its shape, not its spelling, because those repos are
# shell-only and this one runs on GitHub Actions.
#
# Three states that are NOT failures and must not be reported as one:
#
# 1. A run still in progress. The script polls for up to 32 attempts of
#    15 seconds (eight minutes, inside the job's ten-minute bound), so a
#    push run that has not yet reached a verdict waits for one. The
#    brief on the polling bound lives inside the script.
# 2. An empty history for the branch's current head. There is no run
#    for the commit this branch points at. The script reports the head
#    SHA so the operator can match against the API rather than reading
#    "no run on record" and looking for a cron that is not the cause.
# 3. A conclusion of `cancelled` for the branch's head. The script used
#    to pass over cancelled runs on the theory that a newer push had
#    superseded them, but the same logic answered for a commit nobody
#    had tested: measured 2026-09-20, let A pass, push B, cancel B's
#    run by hand with nothing replacing it, and the script reported A's
#    success as the branch's health. The pass-over disappeared with
#    the newest-run logic it belonged to. A `cancelled` run for the
#    head is now RED; the message names the commit so the right run is
#    found.
#
# Permissions: same as the freshness reusable. A called workflow cannot
# elevate beyond the permissions of the workflow that calls it, and
# reading this repository's run history needs `actions: read`. Without
# that grant the run does not start.
#
# NOT A REQUIRED STATUS CHECK. A red `main` would then block the pull
# request that repairs it, which is exactly the situation this check
# exists to surface. The reason lives beside the `uses:` line below; do
# not remove it.

on:
  workflow_call:
    inputs:
      workflow:
        description: >-
          File name of the workflow to check, e.g. "ci.yml".
        type: string
        required: true
      branch:
        description: >-
          Branch whose head's run is the verdict, e.g. "main".
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: branch-health-${{ github.workflow }}-${{ github.ref }}-${{ inputs.workflow }}-${{ inputs.branch }}
  cancel-in-progress: true

jobs:
  health:
    name: branch health
    runs-on: ubuntu-latest
    # Bound: the request itself is small; ten seconds covers the fetch
    # and the poll. The 32 attempts of 15 seconds the script makes add
    # up to eight minutes, which this ten-minute bound covers with two
    # minutes of headroom. A run that waits longer than that has
    # either hung or had the suite fail to start, and the script's
    # own error message points at the right run rather than this
    # timeout.
    timeout-minutes: 10
    permissions:
      actions: read # reading this repository's workflow-run history
    steps:
      # The step below runs a script from this repository, so the tree has to be
      # here. Without this the job dies with `No such file or directory` and exit
      # 127, which reads like a broken script rather than a missing checkout.
      #
      # `persist-credentials: false` because nothing here writes: the API read
      # uses GITHUB_TOKEN from the env below, and leaving a credential in the
      # git config of a job that never pushes is reach it has no use for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This step runs as GITHUB_TOKEN, a job-scoped token on its own rate
      # limit, and reads nothing beyond this repository's own run history. No
      # personal credential is ever used here, and the `actions: read` grant
      # above is the whole of what it can reach.
      #
      # The script owns every API call: on a push it uses HEAD_SHA as
      # the head; on schedule or pull_request HEAD_SHA is empty and the
      # script fetches the branch head itself. Doing both in one place
      # keeps the polling and the verdict logic in a single file the
      # shell tests can exercise end to end with a planted `gh`.
      - name: Check the run for the branch's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow }}
          BRANCH: ${{ inputs.branch }}
          # `github.event_name` inside a called workflow is the event
          # that triggered the caller (push / pull_request / schedule);
          # the reusable's own event is `workflow_call` but the property
          # still refers to the source. So `push` selects GITHUB_SHA
          # and the empty string selects the branch-head lookup path
          # for everything else.
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || '' }}
        run: |
          set -euo pipefail
          bash .github/scripts/check-branch-conclusion.sh
