name: Branch health (reusable)

# Fails when the run for a branch's CURRENT head is not a success.
#
# The companion guard `reusable-schedule-freshness.yml` watches workflows
# that fire on `event=schedule`; this one watches a workflow on a branch.
# The two together are the same idea in two places: a thing that is
# supposed to be true about a workflow is converted from "silence when
# broken" into a red check on ordinary work, because nobody watches a
# quiet log.
#
# The gap the freshness watchers cannot close: they read the newest
# SUCCESSFUL scheduled run, so a failing run is missing from their answer
# by construction.
#
# States that are NOT failures and must not be reported as one:
#
# 1. A run that has not finished: queued or running. The script does not wait
#    for it. It judges the last run that finished before it, in a pass or a
#    failure of any kind, if that run is an ancestor of the head and no older
#    than 48 hours, says so in a notice, and is red only if that run failed.
#    With the runners saturated a suite takes longer than any wait the job
#    could afford, and waiting made the check red for a branch where nothing
#    was broken (podup, 2026-11-24: eight minutes of polling and
#    "no ci.yml run for commit da14bd1 on develop finished"). A suite that
#    has been pending for more than 24 hours is stuck, and that is red.
# 2. A head with no run yet. A commit that has just landed has not had time to
#    start its suite, so for three hours the answer is a warning and a pass.
#    After that the commit never ran anything, and the success of the commit
#    before it is not its own: it is red, as "head without CI".
# 3. A conclusion of `cancelled` for the branch's head. The verdict is the
#    run for the head, so nothing newer can supersede a cancelled run for
#    it: a `cancelled` run for the head is RED, and the message names the
#    commit so the right run is found.
#
# Permissions: same as the freshness reusable. A called workflow cannot
# elevate beyond the permissions of the workflow that calls it, and
# reading this repository's run history needs `actions: read`. Without
# that grant the run does not start.
#
# NOT A REQUIRED STATUS CHECK. A red `main` would then block the pull
# request that repairs it, which is exactly the situation this check
# exists to surface. The reason lives beside the `uses:` line below; do
# not remove it.

on:
  workflow_call:
    inputs:
      workflow:
        description: >-
          File name of the workflow to check, e.g. "ci.yml".
        type: string
        required: true
      branch:
        description: >-
          Branch whose head's run is the verdict, e.g. "main".
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: branch-health-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ inputs.workflow }}-${{ inputs.branch }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  health:
    name: branch health
    runs-on: ubuntu-latest
    # Bound: the script reads one or two pages of runs and, when the run it
    # judges failed, its jobs: a few requests of a second each, and no
    # waiting. Ten minutes is the floor this repository gives a job, and
    # what it covers is a hung request, not a suite that has not finished.
    timeout-minutes: 10
    permissions:
      actions: read # reading this repository's workflow-run history
    steps:
      # The step below runs a script from this repository, so the tree has to be
      # here. Without this the job dies with `No such file or directory` and exit
      # 127, which reads like a broken script rather than a missing checkout.
      #
      # `persist-credentials: false` because nothing here writes: the API read
      # uses GITHUB_TOKEN from the env below, and leaving a credential in the
      # git config of a job that never pushes is reach it has no use for.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # This step runs as GITHUB_TOKEN, a job-scoped token on its own rate
      # limit, and reads nothing beyond this repository's own run history. No
      # personal credential is ever used here, and the `actions: read` grant
      # above is the whole of what it can reach.
      #
      # The script owns every API call: on a push it uses HEAD_SHA as
      # the head; on schedule or pull_request HEAD_SHA is empty and the
      # script fetches the branch head itself. Doing both in one place
      # keeps the polling and the verdict logic in a single file the
      # shell tests can exercise end to end with a planted `gh`.
      - name: Check the run for the branch's current head
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          WORKFLOW: ${{ inputs.workflow }}
          BRANCH: ${{ inputs.branch }}
          # `github.event_name` inside a called workflow is the event
          # that triggered the caller (push / pull_request / schedule);
          # the reusable's own event is `workflow_call` but the property
          # still refers to the source. On push, `github.sha` is the
          # pushed commit, but the two callers in `ci.yml` run
          # cross-branch by design: `health-main` runs on every push
          # that is not to `main`, and `health-develop` on every push
          # that is not to `develop`. A push to the OTHER branch would
          # hand the script a commit that no run on the watched branch
          # ever carries, and the poll loop would exhaust itself asking
          # the API for a run that does not exist. The branch
          # comparison below stops that: `HEAD_SHA` carries the pushed
          # commit only when the push was to the branch being checked,
          # otherwise the empty string selects the branch-head lookup
          # path for everything else (push to a different branch,
          # pull_request, schedule).
          HEAD_SHA: ${{ (github.event_name == 'push' && github.ref_name == inputs.branch) && github.sha || '' }}
        run: |
          set -euo pipefail
          bash .github/scripts/checks/check-branch-conclusion.sh
