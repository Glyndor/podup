name: Workflow lint (reusable)

# Lint this repository's workflow YAML with actionlint. This is where the
# phantom-required-check naming mismatches and the PowerShell $VAR-under-pwsh
# trap have actually shipped, because nothing caught them before CI ran for
# real.
#
# actionlint's embedded shellcheck pass otherwise falls back to whatever
# shellcheck the runner image ships, which floats independently of the
# pinned version (shell-ci.yml). Installing the same pinned shellcheck here
# and pointing actionlint at it with -shellcheck keeps that pass reproducible
# too.
#
# Checks this repository's workflow files: actionlint over the caller's
# workflows, plus the guards that keep the required checks reachable, pinned
# and free of caller-controlled switches.

on:
  workflow_call:
    inputs:
      shellcheck-version:
        description: Exact shellcheck release tag to install from koalaman/shellcheck for actionlint's embedded shellcheck pass; bumped by editing this file
        type: string
        default: "v0.11.0"
      shellcheck-sha256:
        description: sha256 of that release's linux.x86_64 tarball; travels with shellcheck-version, so overriding one without the other fails the install
        type: string
        default: "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
      tooling-isolation:
        description: Fail when a job that holds a secret also installs third-party tooling
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    # The name says which kind of run produced it: nothing for a pull request into
    # `develop` and for the merge queue, `(promotion)` for a pull request into `main`,
    # and the event in brackets for everything else (a push, a schedule). A required
    # check is matched by name on a commit, so the push that lands on `develop` and
    # the pull request that promotes the same commit into `main` must not be able to
    # answer for each other: they get different names and the ruleset of each branch
    # requires its own.
    name: workflow-lint${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || github.event_name != 'pull_request' && github.event_name != 'merge_group' && format(' ({0})', github.event_name) || '' }}
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 32s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: v1.7.12
      # The range the classifier judges and the event that produced it. Every
      # step that installs a tool or reads a workflow reads these, so the
      # range is named once instead of in each step.
      EVENT: ${{ github.event_name }}
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier reads the judge from the reviewed base commit and
          # diffs the whole range, so the history has to be here.
          fetch-depth: 0

      # The judge is read from the base, never from this checkout: a pull
      # request that edited the classifier must not be judged by its own
      # edit. A base without the judge leaves the output empty, and an empty
      # output runs the lint, because the only safe reading of a missing
      # answer is "run".
      - name: Decide whether the workflow lint must run
        id: decide
        run: |
          # A pull request into main runs the lint whatever the range says.
          if [ "$BASE_REF" = main ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            git show "$BASE_SHA:.github/scripts/checks/workflow-lint-inputs.sh" | bash -s -- "$BASE_SHA" "$HEAD_SHA" || true
          fi

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        if: steps.decide.outputs.run != 'false'
        with:
          go-version: "1.27"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: actionlint-cache
        if: steps.decide.outputs.run != 'false'
        with:
          path: ~/go/bin/actionlint
          key: actionlint-${{ runner.os }}-${{ env.ACTIONLINT_VERSION }}

      - name: Install actionlint
        if: steps.actionlint-cache.outputs.cache-hit != 'true' && steps.decide.outputs.run != 'false'
        run: go install "github.com/rhysd/actionlint/cmd/actionlint@${ACTIONLINT_VERSION}"

      - name: Install shellcheck
        if: steps.decide.outputs.run != 'false'
        env:
          SHELLCHECK_VERSION: ${{ inputs.shellcheck-version }}
          SHELLCHECK_SHA256: ${{ inputs.shellcheck-sha256 }}
        run: |
          set -euo pipefail
          # Same verified-download idiom as shell-ci.yml: pinned by tag rather
          # than whatever the runner image preinstalls, and checked against the
          # release's sha256 before extraction, since a plain HTTPS fetch has no
          # registry behind it vouching for what came back.
          dir="$RUNNER_TEMP/shellcheck-bin"
          tarball="$RUNNER_TEMP/shellcheck.tar.xz"
          mkdir -p "$dir"
          curl -sSfL -o "$tarball" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          printf '%s  %s\n' "$SHELLCHECK_SHA256" "$tarball" | sha256sum -c -
          tar -xJ -f "$tarball" -C "$dir" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          chmod +x "$dir/shellcheck"
          echo "SHELLCHECK_BIN=$dir/shellcheck" >> "$GITHUB_ENV"

      - name: Run actionlint over the caller's workflows
        if: steps.decide.outputs.run != 'false'
        env:
          SHELLCHECK_BIN: ${{ env.SHELLCHECK_BIN }}
        run: actionlint -color "-shellcheck=${SHELLCHECK_BIN}"

      # A job that installs third-party tooling is running code we did not
      # write: `cargo install` (and the other installers) executes build
      # scripts over the whole dependency tree, so the secrets a job holds
      # are reachable from code outside this organisation. Keeping the
      # install out of any job that holds a secret bounds that reach to
      # nothing. `pip install --require-hashes` is the exception because a
      # hash-pinned install resolves nothing, since the artifacts are fixed by
      # the lockfile, so no surprise tree appears.
      - name: A job holding a secret must not install third-party tooling
        if: ${{ inputs.tooling-isolation && steps.decide.outputs.run != 'false' }}
        run: |
          python3 .github/scripts/checks/signing-key-isolation.py
          python3 .github/scripts/checks/check-tooling-isolation.py

      # A workflow with a `paths:` filter decides for itself when it runs, and
      # #1568 changed what that decision is made against. While the reusables
      # were `uses: Glyndor/.github/...@<sha>` references, a change to one
      # arrived as a Dependabot commit editing the caller file, and every
      # filter already matched its own file. A local copy is edited directly:
      # nothing touches the caller, so the filter does not fire and the
      # reusable merges without having run.
      #
      # Five workflows here were in that state on 2026-08-28 and the tree gave
      # no sign of it. This is the same defect as #1295 one level up, and the
      # reason it is a check rather than a note in CONTRIBUTING.md is that it
      # is a property of the tree, so it can be asserted instead of remembered.
      #
      # No input guards it. `tooling-isolation` above takes one because it was
      # written to be adopted repository by repository; this rule has one
      # consumer, and a switch that turns a check off is a way for the check to
      # report success without looking. The `if:` below is not such a switch:
      # it is the classifier, and it skips the check only when the files the
      # check reads did not change.
      #
      # Lives in .github/scripts/checks/check-local-reusables.py because the
      # inline heredoc would push this file over the line-limit gate's
      # 500-line hard limit, the same reason the two steps below it live in
      # scripts beside it.
      - name: A path-filtered workflow must watch the reusables it calls
        if: steps.decide.outputs.run != 'false'
        run: python3 .github/scripts/checks/check-local-reusables.py

      # A caller-level `if:` on a job that emits a required check name is a
      # switch, not a filter. GitHub reports a SKIPPED required check as
      # SUCCESS, so one `if:` line can switch off coverage, the MSRV floor,
      # or the validation on a live Podman while the ruleset reports the gate
      # as satisfied.
      #
      # Measured against this repository on 2026-09-06: eleven status checks
      # are required on `main` and ten on `develop`. Every one of them is
      # emitted either directly by a job in this tree or by a reusable a job
      # here calls. Nothing in this repository asserts that property; #1718.
      #
      # The interesting case is `if: always()`. It can never evaluate false,
      # so the job always runs and the check is always reported. Allowed.
      # That is the load-bearing pattern from #1552: a gate job summarises a
      # matrix that may fail, so it has to run on `failure` too and reads
      # `needs.*.result` to make the verdict. The reusable-rust-ci and
      # podman-lane gates are full of it.
      #
      # `if:` lines INSIDE a reusable are not in scope here. They are how
      # the reusable is configured (`if: inputs.msrv != ''`), and refusing
      # them would take down the repository by deleting controls. The step
      # below skips files whose basename starts with `reusable-` so the
      # rejection cannot reach them.
      #
      # Why a list of names and not "any job in any reusable": a ruleset
      # requires a stable name (Glyndor/podup#1552), so the named set is the
      # actual contract. A reuse-side `name: foo (bar)` whose value moves
      # is its own problem; this step refuses a switch in front of it, not
      # the move.
      #
      # Lives here for the same reason tooling-isolation does: a workflow-lint
      # job inside the shell suite would share the fate of the `if:` it tries
      # to gate, and any other required job is the one whose `if:` is the
      # defect being caught.
      - name: A caller of a required check must not carry a switchable `if:`
        if: steps.decide.outputs.run != 'false'
        run: |
          python3 - <<'PY'
          import glob
          import os
          import sys

          import yaml

          sys.path.insert(0, ".github/scripts/lib")
          import ci_yaml

          # Reusables whose jobs' `name:` becomes part of a required check
          # name when a job here calls them. Each entry is the basename of
          # the reusable; the matching caller is any job with
          # `uses: ./.github/workflows/<name>`.
          #
          # The names below are the ones the rulesets on `main` and `develop`
          # require, deduplicated and corrected against
          # `gh pr checks <merged-PR> --required` on 2026-09-06. They move
          # only when a required check is added or removed, and that is
          # pulled by reading the live ruleset, not by guessing.
          REQUIRED_REUSABLES = {
              "reusable-rust-ci.yml": [
                  "Format & lint", "Test", "Coverage", "Doc warnings",
                  "MSRV", "Extra platforms", "Gate",
              ],
              "reusable-dco.yml": [
                  "Signed-off-by present on every commit",
              ],
              "reusable-line-limit.yml": [
                  "line limit",
              ],
              "reusable-main-guard.yml": [
                  "develop-only",
              ],
              "reusable-workflow-lint.yml": [
                  "workflow-lint",
              ],
          }

          # Required check names emitted directly by a job in this
          # repository, not via a reusable call. The set is the value of
          # the job's `name:` field that GitHub reports. A future addition
          # lands here with its check name; the file it sits in is
          # incidental.
          DIRECT_EMITTER_NAMES = {
              "Supported Podman majors",
          }

          # `if: always()` is the only `if:` value allowed on a caller of
          # a required check. It evaluates true on every outcome, so the
          # job runs and the check is reported. Anything else can evaluate
          # false (`false`, `github.event_name == ...`, `inputs.x`,
          # `success()`), and a skipped required check reports Success.
          ALWAYS = "always()"


          def is_switchable(value):
              """True if an `if:` value can skip the job. Anything other
              than `always()` can, including `true` (redundant but not
              skip-causing on its own; refuse on principle so the rule is
              easy to read and the tree does not grow decorative
              conditionals). The point is that the assertion is precise:
              the only blessed form is `always()`, and the reason is that
              it cannot evaluate false."""
              if isinstance(value, bool):
                  return True
              if not isinstance(value, str):
                  return True
              # A bare `if:` is evaluated as an expression whether or not
              # the author wraps it in the dollar-brace form, so the wrapped
              # spelling of `always()` means the same thing. Comparing the
              # raw text would refuse it, which is valid and common, and
              # push somebody to rewrite working code. The wrapper is
              # stripped once, and only when it wraps the whole value:
              # `always() && needs.x.result` keeps its tail, stays unequal
              # and is refused, which is right because it can be false.
              # The opening delimiter is built rather than written out:
              # actionlint parses any literal one it finds inside this
              # `run:` block as an expression of this workflow and fails on
              # it, which is a real trap for anybody editing this scanner.
              open_expr = "$" + "{{"
              text = value.strip()
              if text.startswith(open_expr) and text.endswith("}}"):
                  text = text[len(open_expr):-2].strip()
              return text != ALWAYS


          def main():
              files = ci_yaml.files(".")

              # First pass: walk the reusables themselves to learn which
              # required check names each one emits. The map is asserted
              # against the static list above: a move in a reusable's
              # `name:` is a defect this step refuses to silently follow.
              # Skipping reusable-* in the caller scan below is the reason
              # the static map is needed: those files are scanned for
              # their own internals, not for how callers use them.
              reusable_emits = {}
              for path in files:
                  name = os.path.basename(path)
                  if not name.startswith("reusable-"):
                      continue
                  if name not in REQUIRED_REUSABLES:
                      # An unknown reusable is not in scope; a caller
                      # wrapping it is not gated. Leave it alone.
                      continue
                  try:
                      spec = ci_yaml.load(path)
                  except yaml.YAMLError as e:
                      print(f"::error file={path}::YAML parse error: {e}")
                      sys.exit(1)
                  if not isinstance(spec, dict):
                      continue
                  expected = set(REQUIRED_REUSABLES[name])
                  found = set()
                  jobs = spec.get("jobs") or {}
                  for job_id, job in jobs.items():
                      if not isinstance(job, dict):
                          continue
                      jname = ci_yaml.check_name(job.get("name"))
                      if isinstance(jname, str) and jname in expected:
                          found.add(jname)
                  missing = expected - found
                  if missing:
                      print(
                          f"::warning file={path}::reusable `{name}` no longer "
                          f"emits expected required check name(s) {sorted(missing)}; "
                          "the static map may be stale. Verify against "
                          "`gh pr checks <merged-PR> --required`."
                      )
                  reusable_emits[name] = expected

              violations = []

              for path in files:
                  name = os.path.basename(path)
                  # A reusable's own `if:` lines are INSIDE the reusable
                  # and configure it (`if: inputs.msrv != ''`). They are
                  # not a caller switch and must stay allowed. The same
                  # file is also scanned above for the emit assertion.
                  if name.startswith("reusable-"):
                      continue
                  try:
                      spec = ci_yaml.load(path)
                  except yaml.YAMLError as e:
                      print(f"::error file={path}::YAML parse error: {e}")
                      sys.exit(1)
                  if not isinstance(spec, dict):
                      continue
                  jobs = spec.get("jobs") or {}
                  if not isinstance(jobs, dict):
                      continue
                  for job_id, job in jobs.items():
                      if not isinstance(job, dict):
                          continue
                      # Direct emitter: the job's `name:` is a required
                      # check name. The file the job sits in is
                      # incidental; what the ruleset matches is the
                      # name GitHub reports.
                      job_name = ci_yaml.check_name(job.get("name"))
                      if isinstance(job_name, str) and job_name in DIRECT_EMITTER_NAMES:
                          required_name = job_name
                      else:
                          required_name = None
                      # Reusable caller: `uses:` references a known
                      # required-emitting reusable.
                      caller_required_names = []
                      uses = job.get("uses")
                      if isinstance(uses, str) and uses.startswith("./"):
                          ref = uses[2:]
                          for entry in reusable_emits:
                              if ref.endswith(entry):
                                  caller_required_names = sorted(reusable_emits[entry])
                                  break
                      if required_name is None and not caller_required_names:
                          continue
                      if "if" not in job:
                          continue
                      value = job["if"]
                      if not is_switchable(value):
                          # `if: always()` is the blessed form. Allowed.
                          continue
                      listed = (
                          f"required check `{required_name}`"
                          if required_name is not None
                          else f"required checks {caller_required_names}"
                      )
                      violations.append((
                          path, job_id, value, listed,
                      ))

              if violations:
                  for path, job_id, value, listed in violations:
                      print(
                          f"::error file={path}::job `{job_id}` in {path} "
                          f"emits {listed} and carries a job-level `if:` "
                          f"of `{value!r}`. A caller-level conditional on a "
                          "required check is a switch, not a filter: a "
                          "skipped required check reports Success and does "
                          "not block a merge. Only `if: always()` is allowed "
                          "(it always evaluates true). Move the condition "
                          "into the job's steps, or change it to "
                          "`if: always()` if that is what you mean."
                      )
                  sys.exit(1)
              print(
                  "caller-if: every caller of a required check carries no "
                  "switchable `if:` (only `if: always()` is allowed)."
              )


          if __name__ == "__main__":
              main()
          PY

      # A `uses:` pin shorter or longer than 40 hex characters makes the
      # referenced job unreachable: GitHub answers 422 for any other length,
      # the workflow's run never starts, and the only thing that notices is
      # a release that was supposed to be exercised. This is the check
      # #1741 missed on the way in, and it sits at this layer rather than
      # in the shell suite for the same reason tooling-isolation does:
      # the defect is a pin GitHub rejects, and any other required job is
      # the one whose pinned action never ran.
      #
      # Local reusable calls (`uses: ./.github/workflows/x.yml`) carry no
      # `@` and are naturally excluded: the form has no pin to measure.
      # The third-party form (`uses: owner/repo@<hex> # vX.Y.Z`) is the
      # only one with a pin and the only one this check reaches.
      # The check read lines that start with `uses:`, so a step written as a
      # flow mapping (`- { uses: owner/repo@v7 }`) was never seen; it now reads
      # the parsed YAML, and a `docker://` reference must carry a digest.
      #
      # A tag or branch reference (`uses: owner/repo@v7`) fails the same
      # assertion, and deliberately so: nothing else in this repository
      # refuses one, and no workflow here uses the form, so measuring it
      # closes the gap rather than deferring it to a check that does not
      # exist. `tests/scripts/shell/workflow_lint/reusable-workflow-lint-pin-length.test.sh`
      # covers every branch of this step, including that one.
      # Parse YAML so flow mappings, quoted keys and aliases share one policy.
      # Keep source marks to locate inherited references at their definition.
      # PyYAML is already used by the preceding workflow guards.
      - name: Every `uses:` pin must be 40 hex characters
        if: steps.decide.outputs.run != 'false'
        run: |
          python3 - <<'PY'
          import glob
          import re
          import sys

          import yaml

          sys.path.insert(0, ".github/scripts/lib")
          import ci_yaml

          SHA1_RE = re.compile(r"[0-9a-f]{40}")
          DOCKER_RE = re.compile(r"docker://.+@sha256:[0-9a-f]{64}")


          class MarkedMapping(dict):
              pass


          class WorkflowLoader(ci_yaml.StrictLoader):
              pass


          def marked_mapping(loader, node):
              # Flatten merges before recording marks so inherited uses are checked too.
              loader.flatten_mapping(node)
              result = MarkedMapping()
              result.lines = {}
              for key_node, value_node in node.value:
                  key = loader.construct_object(key_node, deep=True)
                  result[key] = loader.construct_object(value_node, deep=True)
                  result.lines[key] = value_node.start_mark.line + 1
              return result


          WorkflowLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, marked_mapping
          )


          def validate_uses(mapping, location):
              if "uses" not in mapping:
                  return None
              value = mapping["uses"]
              line = mapping.lines["uses"]
              prefix = f"line {line}: {location}: `uses:` value `{value}`"
              if isinstance(value, str) and value.startswith("./"):
                  return None
              if isinstance(value, str) and value.startswith("docker://"):
                  if DOCKER_RE.fullmatch(value):
                      return None
                  return (
                      f"{prefix}: Docker reference must use @sha256: followed by "
                      "exactly 64 hexadecimal characters."
                  )
              pin = value.partition("@")[2] if isinstance(value, str) else ""
              if SHA1_RE.fullmatch(pin):
                  return None
              return (
                  f"{prefix} pins to `{pin}`, which is {len(pin)} characters; "
                  "a SHA-1 pin must be exactly 40 hexadecimal characters. "
                  "GitHub answers 422 for any other length and the job never runs. "
                  "A tag or branch name is refused for a second reason: it moves, "
                  "so it is not a pin."
              )


          def find_violations(spec_path):
              try:
                  with open(spec_path) as fh:
                      spec = yaml.load(fh, Loader=WorkflowLoader)
              except OSError as exc:
                  print(f"::warning file={spec_path}::skipped: {exc}", file=sys.stderr)
                  return []
              except yaml.YAMLError as exc:
                  # A parse failure must not turn an unchecked workflow into a success.
                  return [f"cannot parse workflow YAML: {exc}"]
              if not isinstance(spec, dict) or not isinstance(spec.get("jobs"), dict):
                  return []
              out = []
              for job_id, job in spec["jobs"].items():
                  if not isinstance(job, dict):
                      continue
                  message = validate_uses(job, f"job {job_id}")
                  if message:
                      out.append(message)
                  steps = job.get("steps", [])
                  if not isinstance(steps, list):
                      continue
                  for index, step in enumerate(steps, start=1):
                      if isinstance(step, dict):
                          message = validate_uses(step, f"job {job_id}, step {index}")
                          if message:
                              out.append(message)
              return out


          def main():
              files = ci_yaml.files(".")
              violations = []
              for path in files:
                  violations.extend((path, message) for message in find_violations(path))
              if violations:
                  for path, message in violations:
                      print(f"::error file={path}::{message}")
                  sys.exit(1)
              print(
                  "checkout-pin-length: every `uses:` pin in .github/workflows/ "
                  "is exactly 40 hexadecimal characters; Docker references use "
                  "SHA-256 digests and local references are allowed."
              )


          if __name__ == "__main__":
              main()
          PY

      # The caller-if step above refuses a job-level `if:` that can
      # skip a required job. The same defect repeats through a
      # different lever: a `with:` value a pull request can change that
      # alters what a required job does. The ruleset matches on the
      # CHECK NAME GitHub reports, not on the inputs the job received;
      # `coverage-threshold: 76` -> 0 keeps `rust / Coverage` as the
      # name while lowering the gate below any failing build, and the
      # same shape holds for `msrv: 1.85` -> '', `extra-test-os:
      # '["macos-latest", ...]'` -> '[]', `doc-warnings: true` ->
      # false, `extensions: 'rs go ... yml yaml'` -> a subset,
      # `working-directory: '.'` -> 'src'. Each is a different lever
      # for the same outcome the ruleset cannot see.
      #
      # The fix is to compare each caller's `with:` value to the
      # reusable's declared `inputs.X.default`. A value that matches
      # the default is invisible to the runner (it would have been
      # applied as the default anyway), so the ruleset sees the same
      # job either way. A value that DIFFERS from the default is a
      # pull request changing what a required job does; the step
      # refuses it with a message that names the file, the job, the
      # input key, the supplied value, and the declared default.
      #
      # The reusable is the place where the value the ruleset
      # assumes is canonicalised. A pull request that changes a
      # default is reviewed on the reusable's diff, where the
      # ruleset's check name is fixed by definition (the reusable
      # emits the same `name:` either way), so the change has to be
      # deliberate and visible.
      #
      # Lives in .github/scripts/checks/check-caller-with-defaults.py because
      # the inline heredoc would push this file over the line-limit
      # gate's 500-line hard limit, and the same shape as caller-if
      # above (static map, direct-emitter list, `reusable-*` filter)
      # already lives next to it in this file. An unknown `with:` key
      # (the reusable does not declare it) is silently allowed: GitHub
      # itself ignores it, and the ruleset does not gate on it.
      - name: A caller of a required check must carry `with:` equal to the reusable's declared default
        if: steps.decide.outputs.run != 'false'
        run: |
          python3 .github/scripts/checks/check-caller-with-defaults.py

      # A workflow that emits a develop-required check must trigger on
      # merge_group (with checks_requested in types:), and no other
      # workflow may carry the trigger. Logic lives in
      # .github/scripts/checks/check-merge-group-triggers.py because this file
      # is near the 500-code-line hard limit already.
      - name: A workflow that emits a check required on develop must trigger on merge_group
        if: steps.decide.outputs.run != 'false'
        run: |
          python3 .github/scripts/checks/check-merge-group-triggers.py

      # The token that can cancel other runs (`actions: write`) is held to an
      # exact list of steps, by its effective permissions: `write-all`, a grant
      # at the top of a workflow, and what a job inherits all count. A job that
      # holds it may run only the steps the script lists, and the one launcher
      # that runs a script runs the copy of the base commit, never a file of the
      # pull request's tree. Logic lives in the script; its tests plant each way
      # around it.
      - name: A job that can end other runs runs only the steps the list holds
        if: steps.decide.outputs.run != 'false'
        run: python3 .github/scripts/checks/check-write-token-jobs.py
