name: guard

# Pull request into main only. The reusable's `if:` already restricts to base
# == main, and it is mirrored here because the rulesets require this check on
# main and not on develop. A skipped required check reports Success, so the
# asymmetry is what stops develop merges being blocked by an unanswerable
# check.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["main"]

permissions: {}

# This one judges the base of the pull request, so an edit that changes it has to run it again
# (`edited`), and it is the only one that lists `edited` and `reopened`: it is one job of a few
# seconds, so nothing is cancelled and the run that is cancelled never reports a failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  develop-only:
    uses: ./.github/workflows/reusable-main-guard.yml
