name: CI

on:
  # Not on `develop`: the merge queue runs this workflow on the commit that lands there,
  # and the push that follows is the same commit, so it would repeat what the queue
  # ran. `main` takes a push because a release merge makes a commit nobody ran.
  push:
    branches: [main]
  # Only `opened` and `synchronize`: an edit of the title or the body, or a reopening, starts a second set of runs of
  # the same commit that cancels the first, and the aggregators of the cancelled one still report a failure under the
  # required names. The base is judged again where it matters: `develop` is reached only through the merge queue.
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]
  # The `rust` job is required on develop and the ruleset matches the check
  # name GitHub reports. In a merge queue the event is `merge_group` on a
  # temporary branch; the job must run there too or the queue never merges.
  # `paths:` and `branches:` filters do not apply to merge_group, so this
  # is a top-level trigger rather than a per-event condition.
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

# Cancels superseded pull_request runs only; see asset-contract.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The advisory observations about the repository — schedule freshness, the two
# branch-health gates and the Dependabot freshness gate — live in
# `repository-health.yml`. They read the state of the repository rather than
# the change under review, so they do not belong in the pull request lane.
# That file carries the schedule, the push fallback and the reasons.

jobs:
  # Cuts the runs of this commit at the first job that fails, instead of after the slowest one.
  # It starts with the run, belongs to no `needs` and is not required; the rules are in
  # reusable-stop-on-failure.yml.
  stop-on-failure:
    permissions:
      contents: read
      actions: write
      checks: read
    uses: ./.github/workflows/reusable-stop-on-failure.yml

  rust:
    uses: ./.github/workflows/reusable-rust-ci.yml
    with:
      # Each entry here becomes its own check name: `rust / Test (macos-latest)`
      # and `rust / Test (windows-latest)`. Editing this list changes the names
      # emitted. The pull request that edits it is not blocked, because the
      # ruleset requires `rust / Gate`, whose name carries no value and which
      # reads the result of each suite.
      extra-test-os: "[\"macos-latest\", \"windows-latest\"]"
      # Measured against the WHOLE crate, deliberately: an exclusion list would leave
      # part of the code with no gate at all. This job runs `--lib --bins` with no
      # Podman reachable, so it measures less than the full suite does, and the floor
      # is the integer under what this job reads (76.44% at the last measurement),
      # not under the full suite's figure. It is a ratchet, not a target: raise it
      # when real coverage rises, never lower it to make a red build green. An inline
      # test module counts as covered production code, so moving tests out of the
      # production file changes the denominator. #1696.
      coverage-threshold: 76
      # This number is inside the check name `rust / MSRV (1.88)`. Bumping it
      # emits `rust / MSRV (<new>)`; the ruleset requires `rust / Gate`, whose
      # name does not change, so the pull request carrying the bump is not
      # blocked.
      msrv: "1.88"
      # `cargo publish --dry-run`, and podup is no longer published (#1606).
      package-check: false
      # A semver promise needs somebody to make it to. There is nobody.
      semver-check: false
      doc-warnings: true
      # The Debian package is built with `--no-default-features --features
      # watch,completions` (debian/rules), and the lint above only ever saw
      # `--all-features`, so the configuration that ships was never linted.
      # This string must stay equal to the reusable's declared default: the
      # caller-with-defaults lint refuses a `with:` value that differs from
      # it, so changing the feature set means changing the reusable too.
      extra-clippy-args: "--no-default-features --features watch,completions"

  # When this workflow fails on a pull request, the other runs of the same commit
  # stop: they would spend runners on a commit that is already red. The job and
  # the rules it follows are in reusable-cancel-others.yml.
  cancel-others:
    needs: rust
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-cancel-others.yml

  # A run that is green with a deprecation warning stops working on a date nobody wrote
  # down. This reads the annotations of the jobs of this run once the suites are done, and
  # is required: a required caller carries `if: always()` and nothing else.
  deprecations:
    needs: rust
    if: always()
    permissions:
      contents: read
      actions: read
      checks: read
    uses: ./.github/workflows/reusable-deprecation-notices.yml
