name: Rust fuzz (reusable)

# Scheduled fuzzing for Rust crates: runs `cargo fuzz run` (cargo-fuzz +
# libfuzzer, nightly) against each declared target for a short, bounded time to
# surface parser panics and edge cases on a fixed tree. Callers wire the schedule
# (e.g. nightly cron) and pass the target list in their own workflow. This is a
# smoke run, not a corpus-building soak.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the crate (the one holding the fuzz/ dir)
        type: string
        default: "."
      targets:
        description: >-
          JSON array of cargo-fuzz target names, e.g.
          ["smtp_command","smtp_line","smtp_address"]
        type: string
        required: true
      max-total-time:
        description: Seconds to fuzz each target (libfuzzer -max_total_time)
        type: string
        default: "60"
      timeout:
        description: Per-input timeout in seconds (libfuzzer -timeout)
        type: string
        default: "10"
      toolchain:
        description: Rust toolchain to use (cargo-fuzz requires nightly)
        type: string
        default: "nightly-2026-10-22"
      cargo-fuzz-version:
        description: Exact version of the tool; bumped by editing this file
        type: string
        default: "0.13.2"
      build-only:
        description: >-
          Compile every fuzz target with `cargo fuzz build` and stop, without
          running any. A pull request uses it to learn that a change broke the
          fuzz crate (which sits outside the workspace) before the weekly run.
        type: boolean
        default: false
      rss-limit-mb:
        description: >-
          libfuzzer -rss_limit_mb value in MiB; empty (the default) omits the
          flag entirely, leaving libfuzzer's own default in effect
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: rust-fuzz-${{ github.workflow }}-${{ github.ref }}-${{ inputs.working-directory }}-${{ inputs.build-only }}
  # A manual run on the same ref must not cancel the weekly one halfway: a fuzz
  # run that is cut short leaves no verdict, and the freshness watcher only
  # notices a missing success after two weeks.
  cancel-in-progress: false

jobs:
  fuzz:
    name: cargo fuzz
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 243s; the smoke pass; a longer scheduled pass passes its own seconds and this bound assumes it stays under a quarter of an hour of fuzzing. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(inputs.targets) }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      TOOLCHAIN: ${{ inputs.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ${{ inputs.working-directory }}/fuzz/target
          # The tool version is part of the key: fuzz/Cargo.toml's hash alone
          # doesn't change when the pin is bumped, so a stale cargo-fuzz
          # binary could otherwise survive the command -v short-circuit below.
          key: cargo-fuzz-${{ runner.os }}-${{ inputs.cargo-fuzz-version }}-${{ hashFiles(format('{0}/fuzz/Cargo.toml', inputs.working-directory)) }}

      - name: Install cargo-fuzz
        env:
          CARGO_FUZZ_VERSION: ${{ inputs.cargo-fuzz-version }}
        run: command -v cargo-fuzz >/dev/null || cargo install cargo-fuzz --locked --version "$CARGO_FUZZ_VERSION"

      - name: Build the fuzz targets
        if: inputs.build-only
        run: cargo fuzz build

      - name: Fuzz ${{ matrix.target }}
        if: ${{ !inputs.build-only }}
        env:
          TARGET: ${{ matrix.target }}
          MAX_TOTAL_TIME: ${{ inputs.max-total-time }}
          FUZZ_TIMEOUT: ${{ inputs.timeout }}
          RSS_LIMIT_MB: ${{ inputs.rss-limit-mb }}
        run: |
          libfuzzer_args=(-max_total_time="$MAX_TOTAL_TIME" -timeout="$FUZZ_TIMEOUT")
          if [ -n "$RSS_LIMIT_MB" ]; then
            libfuzzer_args+=(-rss_limit_mb="$RSS_LIMIT_MB")
          fi
          cargo fuzz run "$TARGET" -- "${libfuzzer_args[@]}"

      # A crash leaves its input under fuzz/artifacts. Without this the run is
      # red and the input that caused it is gone with the runner.
      - name: Keep the crashing input
        if: failure() && !inputs.build-only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: ${{ inputs.working-directory }}/fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore
          retention-days: 30
