name: commit hygiene

# Two things history cannot take back, checked before a pull request merges: a
# personal email address in a commit, and something shaped like a credential in
# the lines it adds. Shell only, no third-party tooling, so neither job needs a
# secret or a network.
#
# The dco check only asks for "a name and an address" and passed thirty-four
# commits signed off with a personal one; GitHub's push protection knows the
# formats of other people's tokens, not a signing key of our own.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ["main", "develop"]
  # In the merge queue too: neither of these is advisory.
  merge_group:
    types: [checks_requested]

permissions: {}

# Cancels superseded pull_request runs only.
# A security result is never cancelled by a newer push: the group is the run itself.
concurrency:
  group: ${{ github.workflow }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  commit-identity:
    # Required on develop and on main. The name carries the kind of run, as the other
    # required names do (see reusable-dco.yml), and this check is also asked of the merge
    # queue: a security result is not advisory.
    name: commit identity${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || !(github.event_name == 'merge_group' || github.event_name == 'pull_request' && github.base_ref == 'develop') && format(' ({0})', github.event_name) || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Every commit uses a GitHub noreply address
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: .github/scripts/hygiene/check-commit-identity.sh "$BASE" "$HEAD"

  secret-scan:
    # Required on develop and on main. The name carries the kind of run, as the other
    # required names do (see reusable-dco.yml), and this check is also asked of the merge
    # queue: a security result is not advisory.
    name: secret scan${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || !(github.event_name == 'merge_group' || github.event_name == 'pull_request' && github.base_ref == 'develop') && format(' ({0})', github.event_name) || '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: The change adds no credential-shaped line
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: .github/scripts/hygiene/check-secrets.sh "$BASE" "$HEAD"

  # When this workflow fails on a pull request, the other runs of the same commit
  # stop: they would spend runners on a commit that is already red. The job and
  # the rules it follows are in reusable-cancel-others.yml.
  cancel-others:
    needs: [commit-identity, secret-scan]
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-cancel-others.yml
