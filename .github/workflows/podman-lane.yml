name: podman-lane
# Live-Podman integration for podup.
# Support policy: podup requires Podman 6.2.0 or newer and sets no upper bound, so
# the lane runs the Podman users install and the newest one there is. A pull
# request and the merge queue run the engine suite on the runner, against the
# Podman that apt.glyndor.net serves, the last one Glyndor published
# (`podman-native`). The schedule runs that same job once a day, so a Podman that
# apt starts serving between two pull requests is seen the next morning, and boots
# the VM besides (first slot, and a dispatch): a Fedora qemu VM booted in the runner
# (nested-virt: the ubuntu-24.04 runner exposes /dev/kvm) with full systemd, as a
# rootless user, which carries the newest Podman there is (Podman 6 = Fedora rawhide).

# Three triggers, three questions:
# workflow_dispatch: starts the lane on demand.
# pull_request (no paths): must report on every PR; runtime behaviour is the
# whole point, so this is the gate the merge hangs on.
# schedule: GitHub only reads this from the default branch, so the cron
# works because this workflow lives on main.
on:
  workflow_dispatch:
  # Nightly safety net on the default branch: catches a runtime regression that
  # slipped past PR review within 24h (a scheduled run reports on the default branch).
  schedule:
    # The first slot boots the VM and runs the native lane. The other two run the
    # native lane only, and only when no scheduled run passed it in the last 18
    # hours (`slot` below): they exist so that one cron GitHub does not fire does
    # not leave the day with no look at the Podman of apt, and cost nothing when
    # the first one did fire. `podman-vm` and `slot` read the first slot by this
    # string, so the three of them change together.
    - cron: "0 9 * * *"
    - cron: "20 13 * * *"
    - cron: "20 17 * * *"
  # Runs on EVERY pull request (no path filter) so it can be a required status
  # check that always reports. Runtime behaviour is podup's whole point, so it
  # gates the merge. The internal suite distinguishes nested-virt flakes from real
  # failures and retries a transient once.
  pull_request:
    types: [opened, synchronize]
    branches: [main, develop]
  # Required check on develop (ruleset 17287557): `Supported Podman majors`
  # is matched by name, and the queue fires `merge_group` on a temporary
  # branch. The job must run there too or the queue never merges. `paths:`
  # and `branches:` filters do not apply to merge_group.
  merge_group:
    types: [checks_requested]
permissions:
  contents: read

# One run per ref. Cancelling applies to pull requests only; the nightly and
# a manual dispatch are never superseded.
#
# The `github.ref` below is unique per merge group (the temporary branch is
# `gh-readonly-queue/develop/pr-<N>-<sha>`), so two queue groups never share
# a key and one group's run never cancels another's. The `cancel-in-progress`
# line stays `pull_request` only: a stale queue group should not be cancelled
# while the queue may still promote it.
concurrency:
  group: podman-lane-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Whether anything in this pull request can reach the VM. #1628 changed one
  # paragraph of README.md and paid 17 and 32 minutes of VM time for it, plus
  # the queue; measured the same day on three more pull requests. The lane
  # cannot take a `paths:` filter, because `Supported Podman majors` is a
  # required check and a filtered workflow leaves it unreported, which blocks
  # the merge with nothing saying why. So the job below always runs, and this
  # one tells it whether to boot anything.
  #
  # Path exemptions live in podman-lane-paths.sh, with behaviour tests.
  # They cover only inputs outside the PR/merge-group integration targets;
  # scheduled and manual runs always boot, including the full coverage suite.
  # The classifier comes from the reviewed base commit, like the version judge.
  # Unknown paths and missing classifiers boot the VM. Keep lane helpers active.
  #
  # One case is not an allowlist of names: a pure version bump. It changes
  # Cargo.toml, Cargo.lock and debian/changelog, and a bump used to boot both
  # VMs twice, once on the pull request and once in the merge queue. The
  # Cargo files stay off the list, because Cargo.toml can also carry a
  # dependency change. Instead `.github/scripts/checks/is-version-bump.sh` reads the
  # content of the range and says yes only when the sole change is the podup
  # version line (plain X.Y.Z) in Cargo.toml and in Cargo.lock, plus whole
  # lines put in front of debian/changelog, with nothing else touched. Any
  # other change, any file it cannot read and any error answers no, and no
  # means the path classifier below decides. The script is taken from the
  # base commit, which is already reviewed and merged, so a pull request
  # cannot rewrite the judge of its own diff; where the base does not have it
  # yet, the answer is no. In the merge queue the base is the group's
  # base_sha, which is develop once the script has landed.
  decide:
    name: Decide whether the VM has anything to look at
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 8s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    outputs:
      engine: ${{ steps.files.outputs.engine }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: List the changed files against the base
        id: files
        env:
          EVENT: ${{ github.event_name }}
          # Range the diff runs against. The pull_request event carries the
          # PR's base and head; merge_group carries the squash commit(s)
          # GitHub built for this group (the range that will land on
          # develop). Other events (schedule, workflow_dispatch) leave both
          # empty, which the engine=true short-circuit below handles.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request|merge_group) ;;
            *)
              echo "engine=true" >> "$GITHUB_OUTPUT"
              echo "not a pull request or merge group: the VM always boots on $EVENT"
              exit 0
              ;;
          esac
          # The plan is trusted for a pull request only when its base is exactly develop.
          if [ "$EVENT" = pull_request ] && [ "$BASE_REF" != develop ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "a pull request that is not into develop: the VM always boots"
            exit 0
          fi
          # Fail closed: a diff that cannot be read boots the VM.
          if ! changed="$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA")"; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "could not diff $BASE_SHA..$HEAD_SHA; booting the VM rather than guessing"
            exit 0
          fi
          if [ -z "$changed" ]; then
            echo "engine=true" >> "$GITHUB_OUTPUT"
            echo "empty diff; booting the VM rather than guessing"
            exit 0
          fi
          # A pure version bump may exempt Cargo.toml and Cargo.lock, which
          # the path classifier never admits. The version judge reads the
          # content of the change, not the names. It is read
          # from the base commit, not from this checkout: the checkout is the
          # pull request's own tree, so a pull request that edited the script
          # would be judged by its own edit. If the base has no such script
          # (the pull request that introduces it) `git show` fails, the pipe
          # fails under pipefail, and the path classifier below decides.
          if git show "$BASE_SHA:.github/scripts/checks/is-version-bump.sh" \
              | bash -s -- "$BASE_SHA" "$HEAD_SHA"; then
            echo "engine=false" >> "$GITHUB_OUTPUT"
            echo "a pure version bump: nothing in this range can reach the VM"
            exit 0
          fi
          # Read the path classifier from the base too: an edited helper must
          # not be able to exempt its own changes. A missing base copy boots.
          if git show "$BASE_SHA:.github/scripts/checks/podman-lane-paths.sh" \
              | bash -s -- "$changed"; then
            engine=false
          else
            engine=true
          fi
          echo "engine=$engine" >> "$GITHUB_OUTPUT"
          if [ "$engine" = false ]; then
            echo "nothing in this range can reach the VM; the legs below run and boot nothing"
          fi

  # Whether the native lane has to run on this scheduled slot: not when a scheduled run
  # of this workflow passed it in the last 18 hours. Whatever it cannot read says yes.
  # A pull request, the merge queue and a dispatch do not ask: the job is skipped.
  slot:
    name: Decide whether the native lane is due on this slot
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    # Two calls of the API and a few more for the runs of the last day: seconds. The usual
    # ten minutes is the ceiling.
    timeout-minutes: 10
    outputs:
      due: ${{ steps.due.outputs.due }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Ask whether a scheduled run passed the native lane lately
        id: due
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: bash .github/scripts/podman_lane/native-due.sh

  # The VM, on the schedule and on a dispatch only: it is the lane that follows the
  # newest Podman there is (Fedora rawhide) with full systemd and SELinux, which a
  # pull request does not need to repeat on every push.
  podman-vm:
    # `podman-vm (6)` for the gating suite and `podman-vm (6, coverage)` for the measurement.
    name: podman-vm (${{ matrix.podman }}${{ matrix.mode == 'coverage' && ', coverage' || '' }})
    needs: decide
    # Starts even when `decide` failed. Its steps run on anything but an explicit
    # `false`, so a plan that never answered boots the VM instead of leaving
    # this job skipped, which is the one skip `Supported Podman majors` would
    # have to tell from a decision.
    if: ${{ !cancelled() && github.event_name != 'pull_request' && github.event_name != 'merge_group' && (github.event_name != 'schedule' || github.event.schedule == '0 9 * * *') }}
    runs-on: ubuntu-24.04
    # Two machines, two budgets. The gating suite (the leak scan and the Quadlet generator
    # tests with it) and the instrumented run that measures the coverage used to share one boot
    # and one budget of 70 minutes. The suite alone takes 41 minutes on this runner (15
    # scheduled runs, 2405 to 2484 s), and the coverage pass that followed it needs as much
    # again, so it never finished, and nothing noticed until the floor of the coverage began to
    # apply (v6.0.0) and the nightly went red for a figure that cannot be had in that time.
    # Each leg now has the budget its measurement gives it, with a margin, in
    # .github/podman_lane/budget, and a test holds this matrix to that file. A VM cut at its
    # budget says so (SLOW RUNNER) and names the phase it had reached. The two legs run side by
    # side, so the nightly takes as long as the longer of them and not the sum.
    timeout-minutes: ${{ matrix.job_minutes }}
    strategy:
      fail-fast: false
      matrix:
        # This list appears in the check name `podman-vm (6)`. Editing it
        # changes the emitted name while the ruleset could still require the
        # old one, so the PR carrying the edit would block itself. The stable
        # gate a ruleset should require is `Supported Podman majors`. See #1552.
        podman: ["6"]
        mode: [suite, coverage]
        include:
          - mode: suite
            vm_seconds: 4500
            job_minutes: 100
          - mode: coverage
            vm_seconds: 6240
            job_minutes: 129
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nothing to boot
        if: needs.decide.outputs.engine == 'false'
        run: echo "this pull request changes nothing the VM can observe (see the decide job); reporting success without booting"
      - name: Install qemu + cloud tools
        if: needs.decide.outputs.engine != 'false'
        timeout-minutes: 18
        run: |
          # apt has hung for the whole 95 min job budget on a saturated runner, and the
          # cancelled leg made the merge queue drop the groups behind it. Bound each
          # attempt and retry instead.
          #
          # What was measured (podman-vm legs on 2026-11-06): the step failed four
          # times with all three attempts ending at the 240 s `timeout`, and with
          # `-qq` nothing said which host held it. A host that does not answer is
          # waited for without limit by apt's own defaults, and `apt-get update`
          # ignores an index it could not fetch, so the useful behaviour is to give
          # up on a connection that is silent for 20 s instead of waiting out the
          # whole `timeout`. The output is no longer silenced, so the next failure
          # names the host. The runner image names its mirror in
          # /etc/apt/apt-mirrors.txt (the sources point at it with mirror+file:), so
          # the fallback rewrites that file as well as the sources: rewriting only the
          # sources left every attempt on the Azure host. On 2026-11-11 plain HTTP to
          # both the Azure copy and archive.ubuntu.com timed out on every leg while
          # HTTPS to packages.microsoft.com answered, so the second attempt uses the
          # Ubuntu archive over HTTPS and the third the kernel.org copy over HTTPS.
          export DEBIAN_FRONTEND=noninteractive
          apt_opts=(-o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::ForceIPv4=true)
          echo "apt sources:"
          grep -rhoE 'https?://[^/ ]+' /etc/apt/sources.list /etc/apt/sources.list.d 2>/dev/null | LC_ALL=C sort -u
          for attempt in 1 2 3; do
            if [ "$attempt" -gt 1 ]; then
              mirror="https://archive.ubuntu.com/ubuntu/"
              [ "$attempt" -gt 2 ] && mirror="https://mirrors.edge.kernel.org/ubuntu/"
              echo "apt: attempt $attempt uses $mirror"
              sudo sed -i -E "s#https?://(azure\.)?archive\.ubuntu\.com/ubuntu/?#$mirror#g" /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null || true
              printf '%s\tpriority:1\n' "$mirror" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
            fi
            if sudo timeout 90 apt-get -q "${apt_opts[@]}" update && sudo timeout 210 apt-get -q "${apt_opts[@]}" install -y qemu-system-x86 qemu-utils cloud-image-utils; then
              exit 0
            fi
            echo "apt attempt $attempt failed or timed out"
            sleep 10
          done
          exit 1
      - name: Fetch Fedora cloud image (Podman 6 = rawhide)
        if: needs.decide.outputs.engine != 'false'
        run: |
          # The script lives in .github/scripts/fedora_image/ so it ships with the repo;
          # its logic lives in the script (#1978, after dl.fedoraproject.org
          # answered 404 in streaks longer than the 25 s that
          # `--retry 5 --retry-delay 5` covered). It retries 8 times with a
          # 15 s backoff, falls back to download.fedoraproject.org (Fedora's
          # mirror redirector) on each attempt for the index and the image,
          # downloads the CHECKSUM from dl.fedoraproject.org only, and
          # verifies the SHA-256 of the image against the value the CHECKSUM
          # publishes before letting the step continue. Stdout is the image
          # name; the script writes the image itself to the path passed as
          # $2.
          img=$(bash "$GITHUB_WORKSPACE/.github/scripts/fedora_image/fetch-fedora-image.sh" \
              "${{ matrix.podman }}" "$RUNNER_TEMP/vm.qcow2")
          echo "image: $img"
          # Carry it to the gate step. The name resolves to whatever compose is
          # newest at this moment, so the Podman 6 leg boots a DIFFERENT operating
          # system most days, and that fact lived only in the middle of this
          # step's log. Two runs of this leg are not the same environment, and
          # anyone comparing a failure against the run before it has to know which
          # one they got (#1222).
          echo "VM_IMAGE=$img" >> "$GITHUB_ENV"
          qemu-img resize "$RUNNER_TEMP/vm.qcow2" 40G
      - name: Build cloud-init seed
        if: needs.decide.outputs.engine != 'false'
        run: bash "$GITHUB_WORKSPACE/.github/scripts/podman_lane/build-seed.sh" "${{ matrix.mode }}" "$RUNNER_TEMP/seed"
      - name: Copy the judge out of the workspace
        if: needs.decide.outputs.engine != 'false'
        run: |
          # The VM sees the workspace, and the verification runs on the runner after it: a guest that
          # could write the script that judges it could declare itself green. The VM gets the workspace
          # read-only (readonly=on here, `ro` in its fstab), and what judges it is a copy made before it
          # boots, outside the workspace, that nothing the VM does can reach.
          judge="$RUNNER_TEMP/judge"
          mkdir -p "$judge/.github/scripts"
          cp -R .github/scripts/podman_lane "$judge/.github/scripts/podman_lane"
          cp -R .github/podman_lane "$judge/.github/podman_lane"
      - name: Boot VM (9p = repo only) + capture
        if: needs.decide.outputs.engine != 'false'
        env:
          VM_SECONDS: ${{ matrix.vm_seconds }}
        run: |
          # qemu has its own cap, the budget of the leg, and leaving it above the job's would
          # turn a slow run into one the job kills without a word. Its exit status is kept: 124
          # is `timeout` cutting it, which the verification says as a slow runner.
          set +e
          sudo timeout "$VM_SECONDS" qemu-system-x86_64 -enable-kvm -cpu host -m 6144 -smp 4 \
            -drive file="$RUNNER_TEMP/vm.qcow2",if=virtio,format=qcow2 \
            -drive file="$RUNNER_TEMP/seed/seed.iso",if=virtio,format=raw \
            -netdev user,id=n0 -device virtio-net-pci,netdev=n0 \
            -virtfs local,path=${{ github.workspace }},mount_tag=repo,security_model=none,id=repo,readonly=on \
            -display none -serial stdio 2>&1 | tee "$RUNNER_TEMP/vm.log"
          echo "QEMU_RC=${PIPESTATUS[0]}" >> "$GITHUB_ENV"
          exit 0
      - name: Verify the VM
        if: needs.decide.outputs.engine != 'false'
        env:
          MODE: ${{ matrix.mode }}
          EVENT: ${{ github.event_name }}
          VM_SECONDS: ${{ matrix.vm_seconds }}
        run: |
          # The copy made before the VM booted, not the workspace the VM could write: its paths are
          # the ones the script reads (the floor of the coverage, the known failures, the baseline).
          judge="$RUNNER_TEMP/judge"
          GITHUB_WORKSPACE="$judge" bash "$judge/.github/scripts/podman_lane/verify-vm-log.sh" "$MODE"

  # The same engine suite as `podman-vm`, run directly on the runner against the
  # Podman 6.2 that the Glyndor apt repository serves for Ubuntu 24.04, instead of
  # inside a Fedora rawhide VM (a ~500 MB image, dnf, a build inside the VM and a
  # one-thread suite). It is NOT part of `Supported Podman majors` and nothing
  # requires it: the first runs say how long it takes and whether it is stable,
  # and a failure here is red on purpose (no continue-on-error), to be read.
  #
  # What it does not replace: rawhide validates the newest Podman before any
  # distribution packages it; this job validates the Podman podup tells people to
  # install. Same path filter as the VM: the `decide` job says whether the change
  # can reach the engine.
  # The lane of a pull request and of the merge queue: the engine suite on the runner,
  # against the Podman that apt.glyndor.net serves, which is the one a Debian or Ubuntu
  # user installs, and the same suite once a day on the schedule when `slot` says it is
  # due. It reads the repository and writes nothing: `contents: read` and no secret,
  # while it builds and runs the code of the change.
  podman-native:
    needs: [decide, slot]
    if: ${{ !cancelled() && ((github.event_name == 'pull_request' || github.event_name == 'merge_group') && needs.decide.outputs.engine != 'false' || github.event_name == 'schedule' && needs.slot.outputs.due != 'false') }}
    runs-on: ubuntu-24.04
    # Install a few minutes, build ~10, suite one thread (the VM's one-thread
    # suite is the long pole); 60 leaves room for a first run and stays far below
    # the six-hour default a hang would cost.
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      # Fingerprint of the Glyndor archive key, published in the apt repository's
      # README and not on apt.glyndor.net itself: a tampered archive cannot vouch
      # for its own key. A rotation lists both until the old key is retired.
      GLYNDOR_APT_FPR: 9ADF04EA8C3139CDB67303CFA6705C2EA153F3D6
      PODMAN_FLOOR: 6.2.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Podman from the Glyndor apt repository
        id: install
        # Three tries of at most seven minutes each, and the waits between them.
        timeout-minutes: 25
        run: |
          set -euo pipefail
          start=$SECONDS
          PHASES="$RUNNER_TEMP/phases.txt"
          echo "PHASES=$PHASES" >> "$GITHUB_ENV"
          dl() { # <max-filesize> <url> <output>
            curl -fsSL --proto '=https' --proto-redir '=https' --connect-timeout 10 \
              --max-time 120 --retry 3 --retry-delay 5 --max-filesize "$1" -o "$3" "$2"
          }
          work="$RUNNER_TEMP/glyndor-keyring"
          mkdir -p "$work"
          dl 8388608 https://apt.glyndor.net/glyndor-archive-keyring.deb "$work/keyring.deb"
          dl 65536 https://apt.glyndor.net/glyndor-archive-keyring.deb.asc "$work/keyring.deb.asc"
          # Nothing from the package runs: its files are unpacked into a scratch
          # directory (refusing a package that declares more than 8 MiB), the key
          # inside is compared with the pinned fingerprint, and the detached
          # signature over the whole package is checked with that key. Only then
          # is the key copied into place; the repository file is written here, so
          # whatever the package ships as sources is never used.
          dpkg-deb --fsys-tarfile "$work/keyring.deb" | tar -t -v --numeric-owner |
            awk '$3 !~ /^[0-9]+$/ { bad = 1 } { total += $3 } END { exit (bad || total > 8 * 1024 * 1024) }'
          dpkg-deb -x "$work/keyring.deb" "$work/extracted"
          key="$work/extracted/usr/share/keyrings/glyndor.gpg"
          if [ ! -f "$key" ] || [ -L "$key" ]; then
            echo "::error::the keyring package has no regular glyndor.gpg"; exit 1
          fi
          fprs="$(gpg --show-keys --with-colons "$key" | awk -F: '/^pub:/{want=1;next} /^fpr:/{if(want){print $10;want=0}}')"
          [ -n "$fprs" ] || { echo "::error::the keyring carries no key"; exit 1; }
          for f in $fprs; do
            [ "$f" = "$GLYNDOR_APT_FPR" ] || { echo "::error::the keyring carries a key that is not the pinned one ($f)"; exit 1; }
          done
          GNUPGHOME="$(mktemp -d)" gpg --no-default-keyring --keyring "$key" \
            --verify "$work/keyring.deb.asc" "$work/keyring.deb"
          sudo install -D -m 0644 "$key" /etc/apt/keyrings/glyndor.gpg
          printf 'Types: deb\nURIs: https://apt.glyndor.net\nSuites: stable\nComponents: main\nSigned-By: /etc/apt/keyrings/glyndor.gpg\n' |
            sudo tee /etc/apt/sources.list.d/glyndor.sources >/dev/null
          # The script tries the install up to three times, reads Glyndor's
          # source list only, and fails the step when the packages cannot be had.
          bash .github/scripts/podman_lane/install-podman.sh
          echo "install=$((SECONDS - start))" >> "$PHASES"
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal
          rustup default 1.100.0
      - name: Build the engine test binaries
        run: |
          start=$SECONDS
          cargo test --locked --features test-helpers --test engine_integration --test integration_leak_scan --no-run
          echo "build=$((SECONDS - start))" >> "$PHASES"
      - name: Start the user Podman socket
        run: |
          set -euo pipefail
          # pasta and netavark work under the runtime directory logind creates
          # for the user (/run/user/<uid>) and nowhere else: pasta's AppArmor
          # profile refuses a network namespace under any other path. Lingering
          # makes logind create that directory and start the user manager for
          # an account that never logged in.
          uid=$(id -u)
          sudo loginctl enable-linger "$(id -un)"
          for _ in $(seq 1 30); do
            [ -S "/run/user/$uid/bus" ] && break
            sleep 1
          done
          [ -S "/run/user/$uid/bus" ] || { echo "::error::logind did not start a user manager for uid $uid"; exit 1; }
          export XDG_RUNTIME_DIR="/run/user/$uid"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          mkdir -p "$XDG_RUNTIME_DIR/podman"
          # Started directly and with no idle timeout: the socket-activated
          # unit stops after five idle seconds, in the middle of a suite.
          nohup podman system service --time=0 "unix://$XDG_RUNTIME_DIR/podman/podman.sock" >"$RUNNER_TEMP/podman-service.log" 2>&1 &
          for _ in $(seq 1 30); do
            [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ] && break
            sleep 1
          done
          [ -S "$XDG_RUNTIME_DIR/podman/podman.sock" ] || { echo "::error::the Podman socket did not appear"; cat "$RUNNER_TEMP/podman-service.log"; exit 1; }
          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "PODMAN_SOCKET=$XDG_RUNTIME_DIR/podman/podman.sock"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          } >> "$GITHUB_ENV"
          podman info --format '{{.Host.Security.Rootless}} {{.Version.Version}}'
      - name: Run the engine suite and the leak scan
        env:
          PODUP_REQUIRE_PODMAN: "1"
          RUST_LOG: podup=warn
        run: |
          start=$SECONDS
          rc=0
          cargo test --locked --features test-helpers --test engine_integration || rc=$?
          scan=0
          if [ -s target/podup-leak-scan-pid ]; then
            PODUP_LEAK_SCAN_PID="$(cat target/podup-leak-scan-pid)" \
              cargo test --locked --features test-helpers --test integration_leak_scan || scan=$?
          else
            echo "::error::engine_integration never wrote target/podup-leak-scan-pid; the leak scan had nothing to look for"
            scan=1
          fi
          echo "tests=$((SECONDS - start))" >> "$PHASES"
          [ "$rc" -eq 0 ] && [ "$scan" -eq 0 ]
      - name: Run the Quadlet tests against the generator of this Podman
        # They skip where the generator is older than the minimum, which is
        # every stock runner; here its absence is a failure. They run after a
        # failed suite so both results show, but never after a failed install:
        # without Podman 6.2 they could only fail for a reason that hides the
        # real one.
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          PODUP_REQUIRE_QUADLET_GENERATOR: "1"
        run: |
          start=$SECONDS
          rc=0
          cargo test --locked --features test-helpers --lib quadlet:: || rc=$?
          cargo test --locked --features test-helpers --test hostile_quadlet_units || rc=$?
          echo "quadlet=$((SECONDS - start))" >> "$PHASES"
          [ "$rc" -eq 0 ]
      - name: Show what AppArmor refused
        # A stop that fails with `kill network process: permission denied` is a
        # confined pasta refusing a signal, and only the kernel log says which
        # profile and which rule.
        if: always()
        run: |
          if pasta_bin=$(command -v pasta); then
            echo "$pasta_bin"
            dpkg -S "$pasta_bin" || true
          fi
          find /etc/apparmor.d -maxdepth 1 \( -name '*pasta*' -o -name '*passt*' -o -name '*podman*' \) -print
          sudo aa-status 2>/dev/null | grep -E 'pasta|passt|podman' || true
          sudo dmesg | grep 'apparmor="DENIED"' | sed -E 's/^\[[^]]*\] //; s/pid=[0-9]+ //; s/audit\([^)]*\): //' | sort | uniq -c | sort -rn | head -20 || true
      - name: Report the phases
        if: always()
        run: |
          {
            echo "### Podman native lane"
            echo ""
            if [ -f "$PHASES" ]; then
              sed -E 's/^([a-z]+)=([0-9]+)$/- \1: \2 s/; s/^podman=(.*)$/- podman: \1/' "$PHASES"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  podman-majors:
    # The name says which kind of run produced it: nothing for a pull request into
    # `develop` and for the merge queue, `(promotion)` for a pull request into `main`,
    # and the event in brackets for everything else (a push, a schedule, a pull request
    # on any other base). `==` in an expression ignores case, so the trigger limits the
    # bases with `branches`, which does not, and the gate checks the base in shell. A required
    # check is matched by name on a commit, so the push that lands on `develop` and
    # the pull request that promotes the same commit into `main` must not be able to
    # answer for each other: they get different names and the ruleset of each branch
    # requires its own.
    name: Supported Podman majors${{ github.event_name == 'pull_request' && github.base_ref == 'main' && ' (promotion)' || !(github.event_name == 'merge_group' || github.event_name == 'pull_request' && github.base_ref == 'develop') && format(' ({0})', github.event_name) || '' }}
    # A required status check is matched by name, and `podman-vm (6)` carries the
    # matrix value. The lane follows the newest Podman: when Podman 7 ships, `["6"]`
    # becomes `["7"]`, and on that pull request the name `podman-vm (6)` stops being
    # emitted while a ruleset could still require it, so the pull request that carries
    # the change would block itself. This name does not move, and it keeps its
    # wording from when the lane ran two majors. See #1552.
    needs: [decide, slot, podman-vm, podman-native]
    # `needs` on its own SKIPS this job when the matrix fails, and a skipped required
    # check does not block a merge, the exact failure this job exists to prevent.
    if: always()
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 4s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    steps:
      - name: Reflect the matrix result
        env:
          PLAN: ${{ needs.decide.result }}
          ENGINE: ${{ needs.decide.outputs.engine }}
          VM: ${{ needs.podman-vm.result }}
          NATIVE: ${{ needs.podman-native.result }}
          SLOT: ${{ needs.slot.result }}
          DUE: ${{ needs.slot.outputs.due }}
          SCHEDULE: ${{ github.event.schedule }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [ "$PLAN" = success ] || fail "the plan did not succeed (result: $PLAN)"
          echo "plan: engine='$ENGINE', event $EVENT; native: $NATIVE, vm: $VM"
          # A pull request and the merge queue use the native lane and never the VM; the
          # schedule uses both, the VM on its first slot only, and a dispatch uses the VM
          # and never the native lane. The lane that is not theirs is skipped, and only
          # an explicit `false` of the plan (or of the slot) excuses the one that is.
          case "$EVENT" in
            pull_request | merge_group)
              [ "$SLOT" = skipped ] || fail "the slot was asked for a $EVENT (result: $SLOT)"
              [ "$VM" = skipped ] || fail "the VM ran for a $EVENT (result: $VM)"
              case "$NATIVE" in
                success) ;;
                skipped) [ "$ENGINE" = false ] || fail "the native lane was skipped and the plan did not say so" ;;
                *) fail "the native lane did not pass (result: $NATIVE)" ;;
              esac ;;
            schedule)
              [ "$SLOT" = success ] || fail "the slot did not answer (result: $SLOT)"
              case "$NATIVE" in
                success) ;;
                skipped) [ "$DUE" = false ] || fail "the native lane was skipped on a slot that did not excuse it" ;;
                *) fail "the native lane did not pass (result: $NATIVE)" ;;
              esac
              if [ "$SCHEDULE" = "0 9 * * *" ]; then
                [ "$VM" = success ] || fail "the VM did not pass (result: $VM)"
              else
                [ "$VM" = skipped ] || fail "the VM ran on a slot that is not the first (result: $VM)"
              fi ;;
            *)
              [ "$NATIVE" = skipped ] || fail "the native lane ran for a $EVENT (result: $NATIVE)"
              [ "$VM" = success ] || fail "the VM did not pass (result: $VM)" ;;
          esac
          echo "the Podman lane passed"

  # When this workflow fails on a pull request, the other runs of the same commit
  # stop: they would spend runners on a commit that is already red. The job and
  # the rules it follows are in reusable-cancel-others.yml.
  cancel-others:
    needs: podman-majors
    if: ${{ failure() && github.event_name == 'pull_request' }}
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/reusable-cancel-others.yml

  # A scheduled run that is not green opens an issue, or adds a comment to the one that is
  # open, like the other watchers do: nobody reads a red run on a schedule. `issues: write`
  # is granted to this job alone; it checks out nothing, runs no tool of the repository, and
  # every value reaches the script through env.
  report:
    name: Open an issue when the scheduled Podman lane fails
    needs: [slot, podman-vm, podman-native, podman-majors]
    if: ${{ always() && github.event_name == 'schedule' && needs.podman-majors.result != 'success' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    # Seconds in practice; the usual ten minutes is the ceiling.
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SLOT_RESULT: ${{ needs.slot.result }}
      VM_RESULT: ${{ needs.podman-vm.result }}
      NATIVE_RESULT: ${{ needs.podman-native.result }}
      AGGREGATE_RESULT: ${{ needs.podman-majors.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      ISSUE_TITLE: Scheduled Podman lane failed
    steps:
      - name: Open a single tracking issue and update it on each failure
        run: |
          set -euo pipefail
          NUMBER=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number,title \
            --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // empty')
          DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          WHAT="slot: ${SLOT_RESULT}, native lane: ${NATIVE_RESULT}, VM: ${VM_RESULT}, verdict: ${AGGREGATE_RESULT}"
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "Failed again on ${DATE} (${WHAT}). Run: ${RUN_URL}"
            echo "Commented on #${NUMBER}."
            exit 0
          fi
          gh issue create \
            --title "$ISSUE_TITLE" \
            --label "type:test" --label "prio:P2" --label "area:ci" --label "status:triage" \
            --body "The scheduled Podman lane did not pass on ${DATE} (${WHAT}).

          Run: ${RUN_URL}

          Close this once the scheduled lane is green. While this stays open, each new failure adds a comment here instead of opening another issue."
          echo "Opened new issue."
