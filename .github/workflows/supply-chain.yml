name: Supply chain

# Generate artifacts when dependency or generator inputs change.
# Vulnerability advisories are checked independently by audit.yml.
on:
  pull_request:
    branches:
      - main
      - develop
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "about.hbs"
      - ".github/workflows/supply-chain.yml"
      # While this reusable was a pinned Glyndor/.github reference, a change
      # to it arrived as a Dependabot commit editing the line above, which
      # this filter already matched. A local copy is edited directly, so
      # without this line a pull request that touches only the reusable
      # merges without ever running it.
      - ".github/workflows/reusable-rust-supply-chain.yml"
  push:
    branches:
      - develop
    paths:
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "about.toml"
      - "about.hbs"
      - ".github/workflows/supply-chain.yml"
      - ".github/workflows/reusable-rust-supply-chain.yml"

permissions:
  contents: read

# Cancels superseded pull_request runs only; see asset-contract.yml.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  supply-chain:
    uses: ./.github/workflows/reusable-rust-supply-chain.yml
