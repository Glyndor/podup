name: release

# Trigger is push on a v* tag, plus workflow_dispatch with a tag input. A tag
# push is the only natural release event (a release is a tag), and the
# dispatch lets a release that started from a tag push but failed partway be
# retried against the same tag, without bumping the version.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.3.0)"
        required: true
      dry_run:
        description: "Rehearsal: build, sign with a throwaway key that nobody trusts, check everything, publish nothing"
        type: boolean
        default: false

permissions: {}

env:
  # The key of a rehearsal. It is public on purpose: no installer, updater or channel embeds
  # the key it makes, so what it signs verifies nowhere and the rehearsal can never be mistaken
  # for a release. A run with `dry_run` never reads the real key.
  REHEARSAL_SEED_B64: zVnFFv3VpjbGd6UB3cU4loQoojjHKh7Y3fw6d4/VU+c=

# Serialize runs that observe or publish the same resource without interruption.
concurrency:
  group: release-${{ github.repository }}-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # What is checked before anything is built, and the commit, the version and the tag everything else builds
  # from, are in reusable-release-verify.yml. The audit of the dependencies runs there in a job of its own, and
  # nothing below starts until the whole of it has passed.
  verify:
    name: verify
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-verify.yml
    with:
      tag: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

  # What is compiled, packed and described is in reusable-release-build.yml, called with the
  # commit and the version that `verify` named. It holds `contents: read` and nothing else.
  builds:
    name: builds
    needs: verify
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-release-build.yml
    with:
      commit: ${{ needs.verify.outputs.commit }}
      version: ${{ needs.verify.outputs.version }}
      tag: ${{ needs.verify.outputs.tag }}
      dry_run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}


  # The binaries are signed here, in a job of their own, and not in the job
  # that compiled them. `build` runs the build scripts and proc-macros of every
  # dependency, which is code from outside this organisation with the run of the
  # runner. This job checks the commit out afresh, downloads only the finished
  # binary, and runs nothing but Python with hashed requirements, so nothing a
  # build left in a workspace is here for the key to meet. It holds
  # `contents: read` and the key, and no other permission, and it runs in the
  # environment `release`, which allows only `main` and the `v*` tags. A rehearsal keeps it too: it is
  # started from `main`, after the promotion and before the tag is cut, on the state that will be published.
  sign:
    name: Sign ${{ matrix.asset }}
    needs: [verify, builds, attest]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.builds.result == 'success' && (needs.attest.result == 'success' || inputs.dry_run && needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Bound: the job installs three wheels and signs one file.
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      attestations: read

    strategy:
      fail-fast: false
      matrix:
        asset: [podup-linux-x86_64, podup-linux-arm64, podup-darwin-arm64, podup-darwin-x86_64, podup-windows-x86_64.exe, podup-windows-arm64.exe]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Take the release scripts from the commit that started the rehearsal
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # A rehearsal may name a tag older than these scripts, so they come from the commit that
          # launched the run, the one this workflow file is from. Nothing signed in a rehearsal is
          # published, and the scripts stay out of what the later steps read as changed or new.
          git fetch --no-tags --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git ls-files -z .github/scripts | xargs -0 -r git update-index --skip-worktree
          rm -rf .github/scripts
          git archive FETCH_HEAD .github/scripts | tar -x
          echo '/.github/scripts/' >> .git/info/exclude

      - name: The checkout is the commit that was verified
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: The tag still points at the commit that was verified
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$COMMIT" ] || { echo "::error::the tag $TAG points at $now now, and the release was verified at $COMMIT"; exit 1; }

      # Into a directory of its own, outside the checkout: the artifact comes
      # from the job that ran the build, so what it holds must not be able to
      # land on the signer or its requirements.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.asset }}
          path: ${{ runner.temp }}/artifacts

      - name: Check the artifact is the one file expected
        env:
          ASSET: ${{ matrix.asset }}
        run: bash .github/scripts/release/check-artifact-dir.sh "$RUNNER_TEMP/artifacts" sign "$ASSET"

      # What is signed has to be the bytes the attestation covers, for this tag and this commit, and that is
      # checked on the file that was downloaded and before anything is signed. A rehearsal makes no attestation.
      - name: Verify the provenance of the file about to be signed
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REF: refs/tags/${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
          NAME: ${{ matrix.asset }}
        run: bash .github/scripts/release/verify-provenance.sh "$RUNNER_TEMP/artifacts" "$GH_REPO" "$VERSION" "$NAME"

      - name: Sign binary
        env:
          # A rehearsal signs with the public throwaway key and never reads the secret.
          GLYNDOR_RELEASE_ED25519_KEY: ${{ inputs.dry_run && env.REHEARSAL_SEED_B64 || secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          ASSET: ${{ matrix.asset }}
        run: |
          # The installer/updater verifies this Ed25519 signature; a release
          # without it cannot be consumed. Rotation is by dual-TRUST (consumers
          # bake both accepted public keys) so only the active key signs here,
          # producing the single .sig every verifier reads. Fail closed when the
          # key is absent instead of publishing unsigned binaries.
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to release unsigned binaries."
            exit 1
          fi
          # Install the signing dependencies into an isolated virtual
          # environment so the pinned cryptography is honoured whatever the
          # runner image ships. Every Python here runs with -I: the scripts live in a
          # directory of the tag, and Python puts a script's directory first on its
          # path, so a module planted beside them would be imported by the signer.
          python3 -I -m venv "$RUNNER_TEMP/signvenv"
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          "$venv_py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r .github/scripts/release/sign-requirements.txt
          # Keys are passed via the environment, not argv, so they never appear
          # in the process argument list.
          "$venv_py" -I -X utf8 .github/scripts/release/sign.py "$RUNNER_TEMP/artifacts/$ASSET" "$RUNNER_TEMP/artifacts/$ASSET.sig"

      - name: Upload signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sig-${{ matrix.asset }}
          path: ${{ runner.temp }}/artifacts/${{ matrix.asset }}.sig
          retention-days: 1
          if-no-files-found: error


  # The packages are signed in a job of their own, like the binaries, and not in the job that
  # holds the right to write a release. Each artifact is one package, and its name is derived
  # from the version the tag was verified to carry.
  sign-packages:
    name: Sign ${{ matrix.artifact }}
    needs: [verify, builds, attest]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.builds.result == 'success' && (needs.attest.result == 'success' || inputs.dry_run && needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Bound: the job installs three wheels and signs one file.
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      attestations: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: podup-deb-amd64
            file: podup_%V_amd64.deb
          - artifact: podup-deb-arm64
            file: podup_%V_arm64.deb
          - artifact: podup-rpm-x86_64
            file: podup-%V-1.glyndor.any.x86_64.rpm
          - artifact: podup-rpm-aarch64
            file: podup-%V-1.glyndor.any.aarch64.rpm
          - artifact: podup-pacman-x86_64
            file: podup-%V-1-x86_64.pkg.tar.zst

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Take the release scripts from the commit that started the rehearsal
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # A rehearsal may name a tag older than these scripts, so they come from the commit that
          # launched the run, the one this workflow file is from. Nothing signed in a rehearsal is
          # published, and the scripts stay out of what the later steps read as changed or new.
          git fetch --no-tags --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git ls-files -z .github/scripts | xargs -0 -r git update-index --skip-worktree
          rm -rf .github/scripts
          git archive FETCH_HEAD .github/scripts | tar -x
          echo '/.github/scripts/' >> .git/info/exclude

      - name: The checkout is the commit that was verified
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: The tag still points at the commit that was verified
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$COMMIT" ] || { echo "::error::the tag $TAG points at $now now, and the release was verified at $COMMIT"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ matrix.artifact }}
          path: ${{ runner.temp }}/artifacts

      - name: Check the artifact is the one package expected
        env:
          TEMPLATE: ${{ matrix.file }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          echo "ASSET=${TEMPLATE//%V/$VERSION}" >>"$GITHUB_ENV"
          bash .github/scripts/release/check-artifact-dir.sh "$RUNNER_TEMP/artifacts" sign "${TEMPLATE//%V/$VERSION}"

      # What is signed has to be the bytes the attestation covers, for this tag and this commit, and that is
      # checked on the file that was downloaded and before anything is signed. A rehearsal makes no attestation.
      - name: Verify the provenance of the file about to be signed
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REF: refs/tags/${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
          NAME: ${{ env.ASSET }}
        run: bash .github/scripts/release/verify-provenance.sh "$RUNNER_TEMP/artifacts" "$GH_REPO" "$VERSION" "$NAME"

      - name: Sign package
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ inputs.dry_run && env.REHEARSAL_SEED_B64 || secrets.GLYNDOR_RELEASE_ED25519_KEY }}
        run: |
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to release unsigned packages."
            exit 1
          fi
          python3 -I -m venv "$RUNNER_TEMP/signvenv"
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          "$venv_py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r .github/scripts/release/sign-requirements.txt
          "$venv_py" -I -X utf8 .github/scripts/release/sign.py "$RUNNER_TEMP/artifacts/$ASSET" "$RUNNER_TEMP/artifacts/$ASSET.sig"

      - name: Upload signature
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sig-${{ matrix.artifact }}
          path: ${{ runner.temp }}/artifacts/${{ env.ASSET }}.sig
          retention-days: 1
          if-no-files-found: error


  # The provenance is attested here, in a job that compiles nothing. The
  # permissions that mint it (`id-token`, `attestations`) are for the whole
  # job, so they cannot sit in the jobs that run the build scripts of the
  # dependencies. This job downloads the finished artifacts into a directory
  # outside the checkout, checks their names, and attests exactly those files. A rehearsal makes no
  # attestation: it would leave in GitHub a record of provenance for binaries that are never published.
  attest:
    name: Attest build provenance
    needs: [verify, builds]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    # Bound: the job downloads thirteen files and attests them.
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: The checkout is the commit that was verified
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: The tag still points at the commit that was verified
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$COMMIT" ] || { echo "::error::the tag $TAG points at $now now, and the release was verified at $COMMIT"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podup-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifacts

      - name: Check the artifacts are binaries and packages
        run: bash .github/scripts/release/check-artifact-dir.sh "$RUNNER_TEMP/artifacts" attest

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/artifacts/podup-linux-*
            ${{ runner.temp }}/artifacts/podup-darwin-*
            ${{ runner.temp }}/artifacts/podup-windows-*
            ${{ runner.temp }}/artifacts/podup_*.deb
            ${{ runner.temp }}/artifacts/podup-*.rpm
            ${{ runner.temp }}/artifacts/podup-*.pkg.tar.zst


  # The set is sealed here: everything the release is made of is gathered, checked against the
  # exact list of names the verified version gives, its provenance checked, the checksums made, and
  # what is still unsigned (the checksums, the SBOMs, the notices and the installers) signed. This job
  # holds the key and `contents: read`; it has no right to write a release, and the job that has it
  # never sees the key. What it produces is one artifact, the final set, that the publishing job
  # checks again before anything leaves.
  seal:
    name: Seal the release set
    needs: [verify, builds, sign, sign-packages, attest]
    if: ${{ !cancelled() && needs.verify.result == 'success' && needs.builds.result == 'success' && needs.sign.result == 'success' && needs['sign-packages'].result == 'success' && (needs.attest.result == 'success' || inputs.dry_run && needs.attest.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 33s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      attestations: read
    # The digest of the checksums that were signed: the publishing job takes the set from an artifact
    # and compares it with this before it uses anything of it.
    outputs:
      sums: ${{ steps.sums.outputs.sha256 }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Take the release scripts from the commit that started the rehearsal
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # A rehearsal may name a tag older than these scripts, so they come from the commit that
          # launched the run, the one this workflow file is from. Nothing signed in a rehearsal is
          # published, and the scripts stay out of what the later steps read as changed or new.
          git fetch --no-tags --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git ls-files -z .github/scripts | xargs -0 -r git update-index --skip-worktree
          rm -rf .github/scripts
          git archive FETCH_HEAD .github/scripts | tar -x
          echo '/.github/scripts/' >> .git/info/exclude

      - name: The checkout is the commit that was verified
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: The tag still points at the commit that was verified
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$COMMIT" ] || { echo "::error::the tag $TAG points at $now now, and the release was verified at $COMMIT"; exit 1; }

      # The artifacts are downloaded outside the checkout, for the reason given in the `sign` job,
      # one directory per artifact and not merged on download: merging lets two artifacts that carry a
      # file of the same name replace one another without a word, and the step below refuses that. Three
      # patterns, so that the tools of the SBOM job are not among them.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: podup-*
          path: ${{ runner.temp }}/downloaded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sig-*
          path: ${{ runner.temp }}/downloaded
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom
          path: ${{ runner.temp }}/downloaded/sbom

      - name: Gather the artifacts and check they are exactly what the version is made of
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          bash .github/scripts/release/check-artifact-dir.sh "$RUNNER_TEMP/downloaded" gather "$RUNNER_TEMP/artifacts"
          # The installers are the repository's own, from the checkout.
          cp install.sh install.ps1 "$RUNNER_TEMP/artifacts/"
          bash .github/scripts/release/check-artifact-dir.sh "$RUNNER_TEMP/artifacts" exact "$VERSION" staged

      - name: Verify the provenance of the binaries and packages
        # What is signed below has to be the bytes the attestation covers, for this tag and this commit.
        # A rehearsal makes no attestation, so it has none to verify; a real run cannot skip this.
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REF: refs/tags/${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: bash .github/scripts/release/verify-provenance.sh "$RUNNER_TEMP/artifacts" "$GH_REPO" "$VERSION"

      - name: Verify the Linux binaries carry the hardening they are documented with
        working-directory: ${{ runner.temp }}/artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # Static PIE, full RELRO, non-executable stack, stripped: measured by
          # hand on 5.7.0 and documented in docs/threat-model.md, and until this
          # step nothing in the release asked for them. They come from rustc's
          # musl defaults and [profile.release], not from anything named here,
          # so a toolchain bump or a stray RUSTFLAGS in a build step would drop
          # one and the release would sign and publish it. Checked over the
          # two raw binaries and the binary inside each .deb, before signing,
          # so a failure burns nothing: the release is not immutable yet.
          # The script's own tests build one control per property.
          for arch in amd64 arm64; do
            dpkg-deb -x "podup_${VERSION}_${arch}.deb" "$RUNNER_TEMP/deb-${arch}"
          done
          bash "$GITHUB_WORKSPACE/.github/scripts/hardening/check-hardening.sh" \
            podup-linux-x86_64 \
            podup-linux-arm64 \
            "$RUNNER_TEMP/deb-amd64/usr/bin/podup" \
            "$RUNNER_TEMP/deb-arm64/usr/bin/podup"

      - name: Generate checksums
        working-directory: ${{ runner.temp }}/artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The names come from the list the version gives, not from a glob over what is here.
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/release/expected-assets.py" "$VERSION" checksummed \
            | xargs sha256sum > SHA256SUMS

      - name: Sign SHA256SUMS, the SBOMs, the notices and the installers
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GLYNDOR_RELEASE_ED25519_KEY: ${{ inputs.dry_run && env.REHEARSAL_SEED_B64 || secrets.GLYNDOR_RELEASE_ED25519_KEY }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [ -z "$GLYNDOR_RELEASE_ED25519_KEY" ]; then
            echo "::error::GLYNDOR_RELEASE_ED25519_KEY is not configured; refusing to release unsigned checksums."
            exit 1
          fi
          # Isolated venv so the pinned cryptography is honoured regardless of any system-managed copy
          # on the runner (see the per-binary sign step), and every Python runs with -I.
          python3 -I -m venv "$RUNNER_TEMP/signvenv"
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          "$venv_py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r "$GITHUB_WORKSPACE/.github/scripts/release/sign-requirements.txt"
          # The key is read from GLYNDOR_RELEASE_ED25519_KEY in the environment, not argv. What the
          # binaries and the packages are signed with is done already, by the jobs before this one;
          # the rest is signed here, so a user pinning PODUP_VERSION can verify the script they
          # pipe to a shell as well as the binaries it fetches.
          while IFS= read -r file; do
            "$venv_py" -I -X utf8 "$GITHUB_WORKSPACE/.github/scripts/release/sign.py" "$file"
          done < <(python3 -I "$GITHUB_WORKSPACE/.github/scripts/release/expected-assets.py" "$VERSION" sealed)

      - name: Verify every signature against the keys consumers embed, and that the set is whole
        working-directory: ${{ runner.temp }}/artifacts
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REHEARSAL: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          # sign.py only checks the seed is base64 of 32 bytes, so a wrong-but-
          # well-formed GLYNDOR_RELEASE_ED25519_KEY signs happily and publishes a
          # release nothing can verify. Releases are immutable, so that mistake
          # burns the version. Every asset is verified, each with its own .sig, because a
          # per-binary substitution is the failure SHA256SUMS cannot catch (the manifest can
          # be re-signed to match the swapped binary). The list of what carries a signature is
          # the one the version gives, so an empty directory of signatures cannot pass: a
          # missing signature and an extra one are both a difference from the exact set.
          here="$GITHUB_WORKSPACE/.github/scripts/release"
          bash "$here/check-artifact-dir.sh" . exact "$VERSION" published
          venv_py="$RUNNER_TEMP/signvenv/bin/python"
          if [ "$REHEARSAL" = true ]; then
            PODUP_VERIFY_ONLY_KEY_B64="$(REHEARSAL_SEED_B64="$REHEARSAL_SEED_B64" "$venv_py" -I "$here/public-key-of.py")"
            export PODUP_VERIFY_ONLY_KEY_B64
          fi
          count=0
          want=$(( $(python3 -I "$here/expected-assets.py" "$VERSION" checksummed | wc -l) + 1 ))
          while IFS= read -r file; do
            "$venv_py" -I "$here/verify-signing-key.py" "$file" "$file.sig"
            count=$((count + 1))
          done < <({ python3 -I "$here/expected-assets.py" "$VERSION" checksummed; echo SHA256SUMS; })
          [ "$count" -eq "$want" ] || { echo "::error::$count signatures were verified, $want were expected"; exit 1; }

      - name: Verify every file the installers fetch is staged
        working-directory: ${{ runner.temp }}/artifacts
        run: |
          set -euo pipefail
          # The asset-contract gate compares install.sh against this file and
          # answers "do the two agree on the names". It cannot answer "does the
          # release produce them": a workflow file is a statement of intent,
          # not proof that a step ran. This is where that question is
          # answerable: everything is built, signed and checksummed, and the
          # release is not immutable yet. The script derives what to look for
          # from install.sh's own ${BASE_URL} fetches, so it covers
          # SHA256SUMS.sig too: install.sh aborts without it, and nothing
          # upstream of here ever checked it was produced.
          python3 -I "$GITHUB_WORKSPACE/.github/scripts/release/verify-release-assets.py" \
            --workdir . \
            --install-script install.sh \
            --install-ps1 install.ps1

      - name: Name the digest of the checksums that were signed
        id: sums
        working-directory: ${{ runner.temp }}/artifacts
        run: echo "sha256=$(sha256sum SHA256SUMS | cut -d' ' -f1)" >>"$GITHUB_OUTPUT"

      - name: Upload the sealed set
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-set
          path: ${{ runner.temp }}/artifacts/*
          retention-days: 1
          if-no-files-found: error


  # The release is published here, by a job that holds the right to write one and never the key.
  # What it publishes is the set the sealing job made, checked again against the exact list of
  # names, every signature checked again against the public keys, and the tag looked up one more
  # time: it has to still be the commit that was verified. In a rehearsal it stops there.
  release:
    name: Publish release
    needs: [verify, seal]
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 33s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    permissions:
      contents: write
      attestations: read

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: refs/tags/${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

      - name: Take the release scripts from the commit that started the rehearsal
        if: ${{ inputs.dry_run }}
        shell: bash
        run: |
          set -euo pipefail
          # A rehearsal may name a tag older than these scripts, so they come from the commit that
          # launched the run, the one this workflow file is from. Nothing signed in a rehearsal is
          # published, and the scripts stay out of what the later steps read as changed or new.
          git fetch --no-tags --depth 1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git ls-files -z .github/scripts | xargs -0 -r git update-index --skip-worktree
          rm -rf .github/scripts
          git archive FETCH_HEAD .github/scripts | tar -x
          echo '/.github/scripts/' >> .git/info/exclude

      - name: The checkout is the commit that was verified
        env:
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: test "$(git rev-parse HEAD)" = "$COMMIT"

      - name: The tag still points at the commit that was verified
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$COMMIT" ] || { echo "::error::the tag $TAG points at $now now, and the release was verified at $COMMIT"; exit 1; }

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-set
          path: ${{ runner.temp }}/release

      - name: The files are exactly the set the version is made of
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: bash .github/scripts/release/check-artifact-dir.sh "$RUNNER_TEMP/release" exact "$VERSION" published

      - name: The set is the one the sealing job made
        working-directory: ${{ runner.temp }}/release
        env:
          SEALED: ${{ needs.seal.outputs.sums }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The digest of the checksums is what the sealing job reported when it signed them. A set that
          # is another one, with signatures of its own, is refused before anything of it is used.
          [[ "$SEALED" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::the sealing job reported no digest"; exit 1; }
          [ "$(sha256sum SHA256SUMS | cut -d' ' -f1)" = "$SEALED" ] || { echo "::error::SHA256SUMS is not the one the sealing job signed"; exit 1; }
          sha256sum --strict -c SHA256SUMS
          want="$(python3 -I "$GITHUB_WORKSPACE/.github/scripts/release/expected-assets.py" "$VERSION" checksummed)"
          got="$(awk '{ print $2 }' SHA256SUMS | LC_ALL=C sort)"
          [ "$got" = "$want" ] || { echo "::error::SHA256SUMS does not list exactly the set of the version"; exit 1; }

      - name: Verify the provenance of the binaries and packages
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.verify.outputs.version }}
          SOURCE_REF: refs/tags/${{ needs.verify.outputs.tag }}
          SOURCE_COMMIT: ${{ needs.verify.outputs.commit }}
        run: bash .github/scripts/release/verify-provenance.sh "$RUNNER_TEMP/release" "$GH_REPO" "$VERSION"

      - name: Verify every signature against the keys consumers embed
        working-directory: ${{ runner.temp }}/release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REHEARSAL: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          here="$GITHUB_WORKSPACE/.github/scripts/release"
          python3 -I -m venv "$RUNNER_TEMP/verifyvenv"
          venv_py="$RUNNER_TEMP/verifyvenv/bin/python"
          "$venv_py" -I -m pip install --quiet --require-hashes --only-binary=:all: -r "$here/sign-requirements.txt"
          if [ "$REHEARSAL" = true ]; then
            PODUP_VERIFY_ONLY_KEY_B64="$(REHEARSAL_SEED_B64="$REHEARSAL_SEED_B64" "$venv_py" -I "$here/public-key-of.py")"
            export PODUP_VERIFY_ONLY_KEY_B64
          fi
          count=0
          want=$(( $(python3 -I "$here/expected-assets.py" "$VERSION" checksummed | wc -l) + 1 ))
          while IFS= read -r file; do
            "$venv_py" -I "$here/verify-signing-key.py" "$file" "$file.sig"
            count=$((count + 1))
          done < <({ python3 -I "$here/expected-assets.py" "$VERSION" checksummed; echo SHA256SUMS; })
          [ "$count" -eq "$want" ] || { echo "::error::$count signatures were verified, $want were expected"; exit 1; }

      - name: The tag still points at the commit that was built
        env:
          TAG: ${{ needs.verify.outputs.tag }}
          COMMIT: ${{ needs.verify.outputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/tags/${TAG}:refs/tags/${TAG}"
          now="$(git rev-parse "refs/tags/${TAG}^{commit}")"
          [ "$now" = "$COMMIT" ] || { echo "::error::the tag $TAG points at $now now, and the release was built from $COMMIT"; exit 1; }

      - name: Create GitHub Release
        if: ${{ !inputs.dry_run }}
        working-directory: ${{ runner.temp }}/release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # The files are named one by one from the list the version gives, never by a glob.
          mapfile -t files < <(python3 -I "$GITHUB_WORKSPACE/.github/scripts/release/expected-assets.py" "$VERSION" published)
          gh release create "$TAG" \
            --generate-notes \
            --verify-tag \
            "${files[@]}"

      - name: Say what a rehearsal would have published
        if: ${{ inputs.dry_run }}
        working-directory: ${{ runner.temp }}/release
        run: |
          {
            echo "### Rehearsal: nothing was published"
            echo
            echo "Signed with the throwaway key and verified against it. The set is:"
            echo
            printf -- '- %s\n' *
          } >>"$GITHUB_STEP_SUMMARY"
