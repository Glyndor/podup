name: Rust CI (reusable)

on:
  workflow_call:
    inputs:
      working-directory:
        description: Directory containing the Cargo workspace
        type: string
        default: "."
      # Pinned, not `stable`: an unpinned toolchain moves on its own the day
      # upstream ships a release, and every consumer's pull requests go red at
      # once for a change nobody made. That is not hypothetical: Rust 1.97.0
      # landed on 2026-07-07, widened a clippy lint, and reddened every open PR
      # in podup until the lint was fixed. Bump this pin deliberately, in a
      # pull request of its own, so the lints it gains are read and fixed on
      # their own schedule rather than landing inside unrelated work.
      #
      # It is one of nine sites that write this number. pin-watch.yml reads
      # all nine, reports them disagreeing as a drift of its own, and compares
      # the agreed value against upstream stable every Monday.
      toolchain:
        description: Rust toolchain to pin the build, lint and test jobs to
        type: string
        default: "1.99"
      coverage-threshold:
        description: Minimum line coverage percentage (0 disables the gate)
        type: number
        # Pinned: a caller that passes 0 drops the coverage gate while
        # the ruleset still requires `rust / Coverage`. The reusable
        # carries the configured threshold here so callers can use it
        # by omission; a PR that wants to lower it must move this
        # default on the reusable's own diff, where the ruleset's
        # check name stays stable by definition.
        default: 76
      coverage-ignore-regex:
        description: Regex of file paths to exclude from coverage (e.g. code covered only by a separate DB integration job)
        type: string
        default: ""
      llvm-cov-version:
        description: Exact version of the tool; bumped by editing this file
        type: string
        default: "0.9.1"
      extra-test-os:
        description: JSON array of extra runner images to also run tests on (e.g. '["macos-latest"]')
        type: string
        # Pinned: an empty default disables the Extra platforms gate
        # while the ruleset still requires it. The configured array
        # lives here so callers omit `with:`; a PR that wants to
        # drop platforms moves this default on the reusable's diff.
        default: "[\"macos-latest\", \"windows-latest\"]"
      podman:
        description: Start rootless Podman socket before running the coverage job (ubuntu-latest only)
        type: boolean
        default: false
      msrv:
        description: Minimum supported Rust version to verify a --locked build against (empty disables the check)
        type: string
        # Pinned: an empty default disables the MSRV job while the
        # ruleset still requires `rust / MSRV` and the gated name
        # `rust / MSRV (<version>)`. The configured value lives here
        # so callers omit `with:`; a PR that wants a different MSRV
        # moves this default on the reusable's diff, where the gate
        # name stays stable by definition.
        default: "1.88"
      package-check:
        description: Run cargo publish --dry-run on PRs to catch packaging breakage before tagging
        type: boolean
        default: false
      semver-check:
        description: Run cargo-semver-checks to flag public API breaks against the last published release
        type: boolean
        default: false
      semver-checks-version:
        description: Exact version of the tool; bumped by editing this file
        type: string
        default: "0.51.0"
      doc-warnings:
        description: Build the docs with -D warnings so broken doc links fail the build
        type: boolean
        # Pinned: a caller that passes `false` disables the Doc
        # warnings gate while the ruleset still requires
        # `rust / Doc warnings`. The configured value lives here so
        # callers omit `with:`.
        default: true
      # The Debian package is built from a DIFFERENT crate than the one
      # `--all-features` compiles: debian/rules pins
      # `--no-default-features --features watch,completions`, so `update`
      # is off in the artifact that ships and the code behind it is never
      # compiled by the lint. A defect that only exists when `update` is
      # off is invisible to a lint that only ever sees `--all-features`,
      # and the .deb is what a Debian user installs.
      #
      # The value lives here as the reusable's declared default, and the
      # caller passes the same string: the caller-with-defaults lint
      # (reusable-workflow-lint.yml) refuses a `with:` value that differs
      # from the declared default, so a pull request that dropped this
      # second pass would have to move the default on the reusable's own
      # diff, where the required check name stays fixed.
      extra-clippy-args:
        description: Extra cargo clippy arguments for a second lint pass over another feature set (e.g. '--no-default-features --features watch,completions')
        type: string
        default: "--no-default-features --features watch,completions"

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}-${{ inputs.working-directory }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The range the classifier judges and the event that produced it. Every job
# that asks the classifier whether the Rust lanes have anything to do reads
# these, so the range is named once instead of in each job.
env:
  EVENT: ${{ github.event_name }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}

jobs:
  # The one place the classifier is asked for the jobs that can be skipped
  # whole. `test`, `test-extra` and `coverage` read `outputs.run` and do not
  # even get a runner when the range touches nothing the Rust lanes read; the
  # macOS and Windows legs are the expensive ones, and a step-level skip still
  # paid for a runner of each just to do nothing.
  #
  # Skipping a job is only safe where the required name survives it. A job
  # skipped by its own `if:` reports `skipped`, which a required check accepts,
  # and the matrix jobs are never required themselves: `Extra platforms` is an
  # aggregate that always runs and reads the matrix result. `lint` stays whole
  # because it also runs the checks that must see documentation-only changes.
  classify:
    name: Classify the range
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier reads the judge from the reviewed base commit and
          # diffs the whole range, so the history has to be here.
          fetch-depth: 0

      # The judge is read from the base, never from this checkout: a pull
      # request that edited the classifier must not be judged by its own
      # edit. A base without the judge leaves the output empty, and an empty
      # output runs the lanes, because the only safe reading of a missing
      # answer is "run".
      - name: Decide whether the Rust lanes must run
        id: decide
        run: git show "$BASE_SHA:.github/scripts/checks/rust-ci-inputs.sh" | bash -s -- "$BASE_SHA" "$HEAD_SHA" || true

  lint:
    name: Format & lint
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 49s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier reads the judge from the reviewed base commit and
          # diffs the whole range, so the history has to be here.
          fetch-depth: 0

      # The judge is read from the base, never from this checkout: a pull
      # request that edited the classifier must not be judged by its own
      # edit. A base without the judge leaves the output empty, and an empty
      # output runs the lanes, because the only safe reading of a missing
      # answer is "run".
      - name: Decide whether the Rust lanes must run
        id: decide
        run: git show "$BASE_SHA:.github/scripts/checks/rust-ci-inputs.sh" | bash -s -- "$BASE_SHA" "$HEAD_SHA" || true

      - name: Install toolchain
        if: steps.decide.outputs.run != 'false'
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component rustfmt,clippy
          rustup default "$TOOLCHAIN"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.decide.outputs.run != 'false'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: rust-lint-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-lint-${{ runner.os }}-

      - name: rustfmt
        if: steps.decide.outputs.run != 'false'
        run: cargo fmt --all --check

      - name: clippy
        if: steps.decide.outputs.run != 'false'
        env:
          EXTRA_CLIPPY_ARGS: ${{ inputs.extra-clippy-args }}
        run: |
          set -euo pipefail
          cargo clippy --locked --all-targets --all-features -- -D warnings
          # The second pass lints the feature set the Debian package is
          # built from, which is not a subset of the one above: `update` is
          # off there and its code is never compiled by the first pass.
          if [ -n "$EXTRA_CLIPPY_ARGS" ]; then
            read -ra extra_args <<< "$EXTRA_CLIPPY_ARGS"
            cargo clippy --locked --all-targets "${extra_args[@]}" -- -D warnings
          fi

      # In this job rather than one of its own because this job is already a
      # required check: a new job would report and block nothing until a
      # ruleset named it. The rule and why it exists live in the script.
      #
      # Not gated by the classifier: it is a `git grep` over the tree and it
      # reads the very prose a documentation-only pull request changes, which
      # is the one change that can introduce the word it looks for.
      - name: no planning-note references
        working-directory: .
        run: bash .github/scripts/checks/check-planning-words.sh

      # Same job and for the same reason: a new one would block nothing until a
      # ruleset named it. Both read git's index in about a quarter of a second.
      - name: no vetoed vocabulary
        working-directory: .
        run: bash .github/scripts/checks/check-banned-vocabulary.sh

      # The Rust test of the same name reads every tracked file, and the
      # classifier lets a shell test, the licence or a template skip the Rust
      # lanes. This is the same scan without the toolchain, so the skip loses
      # nothing. Not gated by the classifier, for that reason.
      - name: no private document references
        working-directory: .
        run: bash .github/scripts/checks/check-private-document-references.sh

      # A serialisation error turned into an empty string is invisible: the
      # command prints an empty document and exits zero, and a script reading
      # it sees no rows where the truth is a failure. That rule is a test now,
      # `serialization_errors`, and the test job runs it: it reads the tree's
      # Rust sources the way the shell check did, so a change in any of them
      # still reaches the rule.
      #
      # BASE is the commit the change is measured against, so a pull request
      # cannot raise a ceiling in .github/folder-limit-exceptions.txt.
      - name: folders hold at most twenty files
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_SHA" ]; then
            if git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
              export BASE="$BASE_SHA"
            else
              echo "::warning::could not fetch the base commit; the ceilings are checked but not against it"
            fi
          fi
          bash .github/scripts/checks/folder-limit.sh

  test:
    name: Test
    # Skipped whole when the classifier says nothing here is read. `!cancelled()`
    # and the `result` test are what keep a classifier that failed from skipping
    # this job: a job whose `needs` failed is skipped by default, a skipped job
    # reports a pass to a required check, and that would turn a broken checkout
    # into a green suite. A classifier that did not answer runs the job.
    needs: classify
    if: ${{ !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 106s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Tests
        run: cargo test --locked --all-features --workspace

  test-extra:
    name: Test (${{ matrix.os }})
    needs: classify
    if: ${{ inputs.extra-test-os != '[]' && !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.run != 'false') }}
    runs-on: ${{ matrix.os }}
    # Bound: worst of the last three successful runs on 2026-09-02 was 205s; the slowest leg is windows-latest. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.extra-test-os) }}
    defaults:
      run:
        # This is the only job that can land on a Windows runner, where the
        # default shell is PowerShell, and there `$VAR` reads a PowerShell
        # variable, not the environment, so every `env:` value silently becomes
        # an empty string. Pin the shell so steps behave the same on all three
        # OSes, as release.yml's cross-OS matrix already does.
        shell: bash
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: rust-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-test-${{ runner.os }}-

      - name: Tests
        run: cargo test --locked --all-features --workspace

  extra-platforms-gate:
    name: Extra platforms
    # A required status check is matched by name, so a name carrying a value makes
    # the pull request that changes the value block itself: the job emits a new
    # name, the ruleset still requires the old one, and nothing emits it. This job
    # carries a name that cannot move, so a ruleset gates on "the extra-platform
    # tests passed" without naming which platforms those are. Glyndor/podup#1552.
    needs: test-extra
    # A matrix skipped whole by the classifier arrives here as `skipped`, which is
    # a pass below; this job is the only one of the pair a ruleset names, so it
    # must keep running whatever the matrix did.
    # `needs` on its own SKIPS this job when the dependency fails, and a skipped
    # required check does not block a merge - which is the exact failure this job
    # exists to prevent. `if: always()` plus an explicit result check is what makes
    # it a gate rather than a decoration.
    if: always()
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 4s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    steps:
      - name: Reflect the extra-platform test result
        env:
          RESULT: ${{ needs.test-extra.result }}
        run: |
          set -euo pipefail
          # `skipped` is a pass: test-extra is gated on `extra-test-os != '[]'`, so a
          # caller that asks for no extra platforms has nothing to fail.
          case "$RESULT" in
            success | skipped) echo "extra-platform tests: $RESULT" ;;
            *) echo "::error::extra-platform tests did not pass (result: $RESULT)"; exit 1 ;;
          esac

  coverage:
    name: Coverage
    needs: classify
    if: ${{ inputs.coverage-threshold > 0 && !cancelled() && (needs.classify.result != 'success' || needs.classify.outputs.run != 'false') }}
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 166s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component llvm-tools
          rustup default "$TOOLCHAIN"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            ${{ inputs.working-directory }}/target
          # The tool version is part of the key: a cache built under an older
          # pin must not survive a version bump via the `command -v ... ||`
          # short-circuit below, or the pin would be silently ignored.
          key: rust-cov-${{ runner.os }}-${{ inputs.llvm-cov-version }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-cov-${{ runner.os }}-${{ inputs.llvm-cov-version }}-

      - name: Install cargo-llvm-cov
        env:
          LLVM_COV_VERSION: ${{ inputs.llvm-cov-version }}
        run: command -v cargo-llvm-cov >/dev/null || cargo install cargo-llvm-cov --locked --version "$LLVM_COV_VERSION"

      - name: Start Podman socket
        if: inputs.podman
        id: podman-socket
        run: |
          systemctl --user start podman.socket
          until [ -S "/run/user/$(id -u)/podman/podman.sock" ]; do sleep 0.1; done
          echo "path=unix:///run/user/$(id -u)/podman/podman.sock" >> "$GITHUB_OUTPUT"

      - name: Coverage gate
        env:
          PODMAN_SOCKET: ${{ steps.podman-socket.outputs.path }}
          COVERAGE_IGNORE_REGEX: ${{ inputs.coverage-ignore-regex }}
          COVERAGE_THRESHOLD: ${{ inputs.coverage-threshold }}
        run: |
          cargo llvm-cov --locked --workspace --all-features --summary-only --json --output-path coverage.json \
            ${COVERAGE_IGNORE_REGEX:+--ignore-filename-regex "$COVERAGE_IGNORE_REGEX"}
          PCT=$(python3 -c "import json; print(json.load(open('coverage.json'))['data'][0]['totals']['lines']['percent'])")
          echo "### Coverage: ${PCT}% (threshold: ${COVERAGE_THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          python3 - "$PCT" "$COVERAGE_THRESHOLD" <<'EOF'
          import sys
          pct, threshold = float(sys.argv[1]), float(sys.argv[2])
          sys.exit(0 if pct >= threshold else 1)
          EOF

  msrv:
    name: MSRV (${{ inputs.msrv }})
    if: inputs.msrv != ''
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 62s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether the root build inputs changed
        id: inputs
        run: |
          set -euo pipefail
          build=true
          # The judge is read from the reviewed base, never from the PR's tree,
          # and a missing history or a missing judge builds. A merge group is
          # judged on the whole range the queue built, base to head, which holds
          # every pull request ahead of this one, so it can only build more.
          if [[ "$EVENT" = pull_request || "$EVENT" = push || "$EVENT" = merge_group ]] &&
             changed=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA") &&
             judge=$(git show "$BASE_SHA:.github/scripts/checks/rust-build-inputs.sh") &&
             bash -c "$judge" -- "$changed"; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "Only paths the root build never reads changed; the build is skipped."

      - name: Install MSRV toolchain
        if: steps.inputs.outputs.build == 'true'
        env:
          MSRV: ${{ inputs.msrv }}
        run: |
          rustup toolchain install "$MSRV" --profile minimal
          rustup default "$MSRV"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.inputs.outputs.build == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: rust-msrv-${{ inputs.msrv }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-msrv-${{ inputs.msrv }}-

      - name: Build on the declared MSRV
        if: steps.inputs.outputs.build == 'true'
        run: cargo build --locked --all-features

  msrv-gate:
    name: MSRV
    # Same reason as extra-platforms-gate: `MSRV (1.88)` moves the day the MSRV
    # moves, and takes the gate with it. MSRV is the worse of the two because it is
    # not a matrix - a single job interpolating an input into its own name. The
    # number stays visible in the job log and in the `MSRV (x.y)` job itself.
    needs: msrv
    if: always()
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 4s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    steps:
      - name: Reflect the MSRV result
        env:
          RESULT: ${{ needs.msrv.result }}
        run: |
          set -euo pipefail
          # `skipped` is a pass: msrv is gated on `inputs.msrv != ''`.
          case "$RESULT" in
            success | skipped) echo "MSRV: $RESULT" ;;
            *) echo "::error::MSRV job did not pass (result: $RESULT)"; exit 1 ;;
          esac

  package:
    name: Package check
    if: inputs.package-check
    runs-on: ubuntu-latest
    # Bound: skipped here since publish = false; bounded for the caller that does publish. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

  semver:
    name: Semver checks
    if: inputs.semver-check
    runs-on: ubuntu-latest
    # Bound: skipped here since publish = false; bounded for the caller that does publish. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - name: Install cargo-semver-checks
        env:
          SEMVER_CHECKS_VERSION: ${{ inputs.semver-checks-version }}
        run: command -v cargo-semver-checks >/dev/null || cargo install cargo-semver-checks --locked --version "$SEMVER_CHECKS_VERSION"

      - name: Check for public API breaks
        run: cargo semver-checks check-release

  doc:
    name: Doc warnings
    if: inputs.doc-warnings
    runs-on: ubuntu-latest
    # Bound: worst of the last three successful runs on 2026-09-02 was 56s. Ten times that, rounded up, never under ten
    # minutes; the six-hour default is what a hang would otherwise cost.
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Decide whether the root build inputs changed
        id: inputs
        run: |
          set -euo pipefail
          build=true
          # The judge is read from the reviewed base, never from the PR's tree,
          # and a missing history or a missing judge builds. A merge group is
          # judged on the whole range the queue built, base to head, which holds
          # every pull request ahead of this one, so it can only build more.
          if [[ "$EVENT" = pull_request || "$EVENT" = push || "$EVENT" = merge_group ]] &&
             changed=$(git diff --name-only --no-renames "$BASE_SHA" "$HEAD_SHA") &&
             judge=$(git show "$BASE_SHA:.github/scripts/checks/rust-build-inputs.sh") &&
             bash -c "$judge" -- "$changed"; then
            build=false
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
          [ "$build" = true ] || echo "Only paths the root build never reads changed; the build is skipped."

      - name: Install toolchain
        if: steps.inputs.outputs.build == 'true'
        env:
          TOOLCHAIN: ${{ inputs.toolchain }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          rustup default "$TOOLCHAIN"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.inputs.outputs.build == 'true'
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ inputs.working-directory }}/target
          key: rust-doc-${{ runner.os }}-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-doc-${{ runner.os }}-${{ inputs.toolchain }}-

      - name: Build docs with warnings denied
        if: steps.inputs.outputs.build == 'true'
        env:
          RUSTDOCFLAGS: "-D warnings"
        run: cargo doc --no-deps --all-features
