version: 2

# Cadence. Every ecosystem runs once a week, each on its own weekday, so the
# pull requests of one week do not all land on the same CI queue: actions on
# Monday, the workspace crates on Tuesday, the fuzz crate on Wednesday, the
# timing helper on Thursday, the benchmark image and the release-signing
# requirements on Friday. Security updates ignore both the schedule and the
# cooldown, so a vulnerable dependency is still proposed the day it is
# published. The cooldown keeps a release from becoming a pull request until it
# has been out a few days: a yanked or quickly superseded version never costs a
# full CI run, and a major waits longer than a patch.
#
# What this config cannot do: Dependabot has no per-group label, so a major
# arrives in its own pull request (the `-major` group, visible in the branch
# and the title) with the same labels as everything else in its entry. Base
# images named inside workflow files (`container:`, `image:`) are outside every
# ecosystem it offers; `pin-watch.yml` compares the `debian:trixie` digest
# pinned in `release.yml` and in `reusable-rust-debian.yml`.

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "UTC"
    # A major waits one week, not two: `reusable-dependabot-freshness.yml` fails
    # when the newest Dependabot pull request is over 15 days old and a pin is
    # behind, and a weekly run plus a longer wait would cross that line.
    cooldown:
      default-days: 3
      semver-major-days: 7
    labels: ["type:deps", "type:ci", "area:ci"]
    open-pull-requests-limit: 10
    target-branch: "develop"
    # Seven distinct `actions/*` actions across the workflows (attest-build-
    # provenance, cache, checkout, download-artifact, setup-go, setup-python,
    # upload-artifact), all SHA-pinned. The fifteen reusables the workflows
    # call are local `./.github/workflows/` files, which this ecosystem has
    # nothing to bump. Without grouping, one upstream release day
    # means near-identical pull requests and full CI runs per action. One pull
    # request per day is enough to review the same information.
    # Grouped into two, not one. The Glyndor reusables and the actions/* get
    # opposite answers from the same review, and a single group forces one
    # answer for both.
    #
    # A .github release usually changes nothing this repository calls. The
    # reusables come back byte-identical and I close the bump as a no-op. A
    # third-party bump is the opposite: actions/checkout moving is the one
    # thing here worth reading line by line.
    #
    # Under patterns: ["*"] both arrive in the same pull request, so closing
    # the no-op closes the bump that mattered. That is the whole reason for
    # the split: one pull request, one answer.
    #
    # The second group is named `github-owned`, not `third-party` as in apt.
    # apt's comment calls it "third-party" but in this repository every
    # non-Glyndor `uses:` is in the `actions/*` namespace (checkout, cache,
    # setup-python, setup-go, upload-artifact, download-artifact,
    # attest-build-provenance) -- all
    # GitHub-owned, all runner primitives per the org CI standard. `third-party`
    # is the wrong word here: it implies an external maintainer I need to
    # audit, when in fact this group is GitHub's own primitives. The name
    # should describe what it matches.
    #
    # That split has nothing left to separate. #1566 through #1568 made this
    # repository self-contained: every reusable it calls now lives here, so no
    # `Glyndor/.github` reference survives for the pattern to match. The group
    # matched nothing and its companion exclusion excluded nothing -- a config
    # claiming coverage it does not have. apt reached the same state at #125.
    groups:
      github-owned:
        patterns: ["*"]
        # A major is left out of the group on purpose, so it arrives in a pull request of its own: it is
        # the bump that can change what an action does, and the one worth reading
        # line by line. The cargo entry below follows the same rule.
        update-types: ["minor", "patch"]
      github-owned-major:
        patterns: ["*"]
        update-types: ["major"]
    # Dependabot infers a prefix from the commit history when this is absent,
    # and the inference has been unstable across repositories (build(deps):
    # Bump ... in some, chore(deps): bump ... in others). Set it so the
    # generated title is predictable and matches homebrew-tap and scoop-bucket.
    commit-message:
      prefix: chore

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels: ["type:deps", "area:core"]
    open-pull-requests-limit: 10
    target-branch: "develop"
    # Grouped by the ANSWER the pull request needs, which is the split the CI
    # standard asks for, not by convenience. A patch or minor bump of a crate
    # this repository already depends on is one question with one answer: does
    # CI still pass. Nineteen of them arrived one per pull request before this,
    # each carrying the same answer and the same review.
    #
    # A major is left OUT of the group deliberately, so it arrives in a pull request of its own. It is
    # the one that can change behaviour, and the reason to split is the same
    # reason the org splits its reusable bumps: a pull request that mixes a
    # question needing thought with several that do not is answered by the
    # cheap ones.
    #
    # The limit is what makes this more than tidiness. It is 10, and once it is
    # full Dependabot stops proposing anything at all, including the security
    # bump the queue exists to deliver. Twenty-three direct dependencies and a
    # lockfile of about 150 packages can reach that on an ordinary week.
    groups:
      cargo-patch-and-minor:
        patterns: ["*"]
        update-types: ["patch", "minor"]
      # Majors share one pull request of their own, apart from the group above,
      # so the bump that can change behaviour is never closed together with
      # the routine ones and its title says what it is.
      cargo-major:
        patterns: ["*"]
        update-types: ["major"]
    commit-message:
      prefix: chore

  # `Cargo.toml` excludes `fuzz` and `bench/timeit` from the workspace, so each
  # carries its own `Cargo.lock` and the `/` entry above never touches either.
  # That is not a detail of layout: a lockfile nothing updates is a lockfile
  # that keeps whatever advisory it was pinned to, and `cargo audit` in
  # `audit.yml` reads the workspace lock rather than these two. The fuzz harness
  # is the sharper of the pair, since it exists to be fed hostile input.
  #
  # Both group every update type, majors included, unlike the crate above. The
  # reason the main entry leaves majors out is that a major can change what
  # podup does for a user; nothing here is shipped, so a major in either is the
  # same question as a patch: does the harness still build and run.
  - package-ecosystem: "cargo"
    directory: "/fuzz"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels: ["type:deps", "type:ci", "area:ci"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    groups:
      fuzz-crate:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: "cargo"
    directory: "/bench/timeit"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels: ["type:deps", "type:ci", "area:ci"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    groups:
      bench-timeit-crate:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: "docker"
    directory: "/bench/scenarios/build"
    # The base image of the build benchmark is pinned by tag and digest
    # (`alpine:3.24@sha256:...`): a digest alone gives this ecosystem no release
    # stream to follow, and the pin had sat five months behind. Nothing else
    # carries an Alpine security fix into it. The same digest is written out in
    # every other scenario's compose file that uses Alpine (nine of the other
    # thirteen), which this entry does not read. The remaining four pin busybox,
    # nginx or redis by digest alone, and nothing follows those: they move by
    # hand. The pull request for this Dockerfile fails
    # `bench_pins_one_image_digest` until `bench/lib/sync-image-digest.sh` is
    # run on its branch, and that is the whole manual step.
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels: ["type:deps", "type:ci", "area:ci"]
    open-pull-requests-limit: 5
    target-branch: "develop"
    commit-message:
      prefix: chore

  - package-ecosystem: "pip"
    directory: "/.github/scripts/release"
    # The release-signing scripts (`.github/scripts/release/sign.py`,
    # `verify-signing-key.py`) pull `cryptography` from this manifest. Without
    # this entry, Dependabot only surfaces the ecosystem via the manual
    # GitHub security-scan alert -- GitHub found the then-pinned
    # `cryptography 48.0.1` only because CVE-2026-69247 matched a fingerprint,
    # not because Dependabot tracks the file (the pin has moved since). Adding
    # the ecosystem here brings it in the rotation that the cargo and
    # github-actions ecosystems already have.
    schedule:
      interval: "weekly"
      day: "friday"
      time: "09:00"
      timezone: "UTC"
    cooldown:
      default-days: 3
      semver-major-days: 14
    labels: ["type:deps", "type:ci", "area:ci"]
    open-pull-requests-limit: 10
    target-branch: "develop"
    # The manifest carries a hash for every package, and the `pip install`
    # that reads it passes `--require-hashes` on its command line (the file
    # does not hold the flag). It holds the whole tree of
    # `cryptography`: cffi and pycparser are pinned beside it and pycparser is
    # cffi's own requirement. A bump of one alone can leave the file asking for
    # a pair that does not resolve, and the signing step is the one that finds
    # out. They arrive together, in one pull request, so the file is always a
    # set that was installed whole. Majors stay in: nothing here ships, the
    # question is the same as for a patch, whether the signer still installs
    # and still signs.
    groups:
      release-signing:
        patterns: ["*"]
    commit-message:
      prefix: chore
