# cargo-deny configuration. Enforces the supply-chain policy locally and in CI:
# audited advisories, a permissive-license allowlist, and a ban on wildcard
# version requirements. Duplicate versions are reported (warn) rather than
# denied: the only duplicates today come from the Windows target and the
# dev-only tempfile tree, none of which reach the Linux production binary.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# RUSTSEC-2024-0449: unsafe-libyaml 0.2.11 is unmaintained. It is not a
# known vulnerability. It comes in through serde_yaml_ng 0.10.0, the latest
# release, so no bump clears it. What it parses is the compose file of the
# person running podup. Moving off it is #2035, and that pull request
# removes this entry and the one in .cargo/audit.toml.
# tests/audit_ignore_lists.rs keeps the two lists equal.
ignore = [
    { id = "RUSTSEC-2024-0449", reason = "unmaintained, not a known vulnerability; pulled by serde_yaml_ng 0.10.0, the latest release; see #2035" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Every license present in the dependency tree. A crate carrying anything not
# listed here fails the check, forcing a deliberate review before it ships.
allow = [
	"Apache-2.0",
	"Apache-2.0 WITH LLVM-exception",
	"MIT",
	"0BSD",
	"BSD-1-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"ISC",
	"Unicode-3.0",
	"Unlicense",
	"Zlib",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
